<!-- ==========================================
     TELETHON - TEACHER SIDEBAR
     Reusable Sidebar Component
=========================================== -->

<aside class="teacher-sidebar" id="teacherSidebarPanel">

    <!-- LOGO -->
    <div class="teacher-sidebar-logo">

        <img
            src="assets/images/logo.png"
            alt="Telethon Logo"
        >

        <h2>Telethon</h2>

        <p>Teacher Panel</p>

    </div>


    <!-- USER -->
    <div class="teacher-sidebar-user">

        <div class="teacher-sidebar-user-icon">
            <i class="fa-solid fa-circle-user"></i>
        </div>

        <div class="teacher-sidebar-user-info">

            <strong id="teacherSidebarUserName">
                Teacher
            </strong>

            <span>
                Teacher Account
            </span>

        </div>

    </div>


    <!-- MENU -->
    <nav class="teacher-sidebar-menu">

        <div class="teacher-sidebar-menu-title">
            Menu
        </div>


        <!-- DAILY COLLECTION -->
        <a
            href="daily-entry.html"
            class="teacher-menu-link"
            data-page="daily-entry.html"
        >

            <i class="fa-solid fa-calendar-plus"></i>

            <span>
                Daily Collection
            </span>

        </a>


        <!-- SUMMARY -->
        <a
            href="summary.html"
            class="teacher-menu-link"
            data-page="summary.html"
        >

            <i class="fa-solid fa-chart-pie"></i>

            <span>
                Summary
            </span>

        </a>


        <!-- ==================================
             FUTURE OPTIONS
             
             Yahan future me options add kar sakte hain.

             Example:

             <a
                 href="history.html"
                 class="teacher-menu-link"
                 data-page="history.html"
             >
                 <i class="fa-solid fa-clock-rotate-left"></i>
                 <span>Collection History</span>
             </a>

        =================================== -->


        <!-- LOGOUT -->
        <a
            href="index.html"
            class="teacher-menu-link teacher-logout-link"
            id="teacherSidebarLogout"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>
                Logout
            </span>

        </a>

    </nav>

</aside>
