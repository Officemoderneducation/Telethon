     MOBILE TOGGLE
     ====================================== -->

<button
    type="button"
    class="admin-sidebar-toggle"
    id="adminSidebarToggle"
    aria-label="Open Menu">

    <i class="fa-solid fa-bars"></i>

</button>


<!-- ======================================
     MOBILE OVERLAY
     ====================================== -->

<div
    class="admin-sidebar-overlay"
    id="adminSidebarOverlay">
</div>


<!-- ======================================
     ACTIVE PAGE + MOBILE SIDEBAR JS
     ====================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        /* ==================================
           ACTIVE PAGE
           ================================== */

        const currentPage =
            window.location.pathname
                .split("/")
                .pop()
                .toLowerCase();


        const sidebarLinks =
            document.querySelectorAll(
                ".admin-sidebar-link[data-page]"
            );


        sidebarLinks.forEach(
            function (link) {

                const page =
                    String(
                        link.dataset.page || ""
                    ).toLowerCase();


                if (
                    page === currentPage
                ) {

                    link.classList.add(
                        "active"
                    );

                }

            }
        );


        /* ==================================
           MOBILE ELEMENTS
           ================================== */

        const sidebar =
            document.getElementById(
                "adminSidebar"
            );


        const toggle =
            document.getElementById(
                "adminSidebarToggle"
            );


        const overlay =
            document.getElementById(
                "adminSidebarOverlay"
            );


        /* ==================================
           OPEN SIDEBAR
           ================================== */

        if (toggle) {

            toggle.addEventListener(
                "click",
                function () {

                    if (sidebar) {

                        sidebar.classList.add(
                            "open"
                        );

                    }

                    if (overlay) {

                        overlay.classList.add(
                            "active"
                        );

                    }

                }
            );

        }


        /* ==================================
           CLOSE SIDEBAR
           ================================== */

        if (overlay) {

            overlay.addEventListener(
                "click",
                function () {

                    if (sidebar) {

                        sidebar.classList.remove(
                            "open"
                        );

                    }

                    overlay.classList.remove(
                        "active"
                    );

                }
            );

        }


        /* ==================================
           CLOSE AFTER MENU CLICK
           ================================== */

        sidebarLinks.forEach(
            function (link) {

                link.addEventListener(
                    "click",
                    function () {

                        if (sidebar) {

                            sidebar.classList.remove(
                                "open"
                            );

                        }

                        if (overlay) {

                            overlay.classList.remove(
                                "active"
                            );

                        }

                    }
                );

            }
        );


        /* ==================================
           LOGOUT
           ================================== */

        const logout =
            document.getElementById(
                "adminSidebarLogout"
            );


        if (logout) {

            logout.addEventListener(
                "click",
                function (e) {

                    e.preventDefault();


                    localStorage.removeItem(
                        "loggedInEmpCode"
                    );


                    localStorage.removeItem(
                        "userRole"
                    );


                    localStorage.removeItem(
                        "userName"
                    );


                    window.location.href =
                        "../index.html";

                }
            );

        }

    }
);

</script>
