     File: region-sidebar.html
============================================= -->

<aside class="region-sidebar" id="sidebar">

    <!-- BRAND -->
    <div class="region-sidebar-brand">

        <img
            src="assets/images/logo.png"
            alt="Telethon Logo"
            class="region-sidebar-logo"
        >

        <div class="region-sidebar-brand-text">

            <h2>Telethon</h2>

            <p>Region User Panel</p>

        </div>

    </div>


    <!-- USER -->
    <div class="region-sidebar-user">

        <div
            class="region-sidebar-user-name"
            id="sidebarUserName"
        >
            Region User
        </div>

        <div class="region-sidebar-user-role">
            Region User Account
        </div>

    </div>


    <!-- MENU -->
    <nav class="region-sidebar-menu">

        <div class="region-menu-title">
            MAIN MENU
        </div>


        <!-- REGION SUMMARY -->
        <a
            href="region-summary.html"
            class="region-menu-link"
        >

            <i class="fa-solid fa-chart-pie"></i>

            <span>
                Region Summary
            </span>

        </a>


        <!-- REGION USER -->
        <a
            href="region-user.html"
            class="region-menu-link"
        >

            <i class="fa-solid fa-users"></i>

            <span>
                Region User
            </span>

        </a>


        <!-- DAILY REPORT -->
        <a
            href="daily-report.html"
            class="region-menu-link"
        >

            <i class="fa-solid fa-calendar-days"></i>

            <span>
                Daily Report
            </span>

        </a>

    </nav>


    <!-- BOTTOM -->
    <div class="region-sidebar-bottom">

        <a
            href="#"
            id="logoutBtn"
            class="region-menu-link region-logout-link"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>
                Logout
            </span>

        </a>

    </div>

</aside>
