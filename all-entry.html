<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>All Entry | Telethon</title>


    <!-- =====================================
         MAIN CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >


    <!-- =====================================
         FONT AWESOME
    ====================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- =====================================
         ADMIN SIDEBAR CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="components/admin-sidebar.css"
    >


    <style>

        /* =====================================
           GLOBAL
        ====================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            background: #f4f6f9;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }


        /* =====================================
           MAIN CONTENT
           
           IMPORTANT:
           Sidebar yahan manually nahi hai.
           Admin Sidebar components/admin-sidebar.html
           se load hoga.
        ====================================== */

        .main {

            margin-left: 235px;

            width: calc(100% - 235px);

            min-height: 100vh;

            padding: 25px;

            overflow-x: hidden;
        }


        /* =====================================
           TOPBAR
        ====================================== */

        .topbar {

            background: #ffffff;

            padding: 20px 25px;

            border-radius: 12px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.06);
        }


        .topbar h2 {

            margin: 0 0 5px;

            color: #1e293b;

            font-size: 24px;
        }


        .topbar p {

            margin: 0;

            color: #64748b;

            font-size: 14px;
        }


        /* =====================================
           FILTER CARD
        ====================================== */

        .filter-card {

            background: #ffffff;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.06);
        }


        .filter-title {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 18px;
        }


        .filter-title h3 {

            margin: 0;

            color: #1e293b;

            font-size: 18px;
        }


        .filter-title i {

            color: #2563eb;
        }


        /* =====================================
           FILTER GRID
        ====================================== */

        .filter-grid {

            display: grid;

            grid-template-columns:
                repeat(5, minmax(150px, 1fr));

            gap: 15px;
        }


        .filter-group {

            min-width: 0;
        }


        .filter-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: bold;

            color: #475569;
        }


        .filter-group select,
        .filter-group input {

            width: 100%;

            height: 42px;

            padding: 8px 12px;

            border:
                1px solid #cbd5e1;

            border-radius: 7px;

            background: #ffffff;

            font-size: 14px;

            outline: none;
        }


        .filter-group select:focus,
        .filter-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,0.10);
        }


        .filter-group select:disabled {

            background: #f1f5f9;

            color: #94a3b8;

            cursor: not-allowed;
        }


        /* =====================================
           FILTER BUTTON
        ====================================== */

        .filter-buttons {

            display: flex;

            gap: 10px;

            margin-top: 18px;
        }


        .reset-btn {

            height: 42px;

            padding: 0 20px;

            border: none;

            border-radius: 7px;

            background: #64748b;

            color: #ffffff;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .reset-btn:hover {

            background: #475569;
        }


        /* =====================================
           SUMMARY
        ====================================== */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 20px;
        }


        .summary-card {

            background: #ffffff;

            padding: 18px 20px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.06);
        }


        .summary-card span {

            display: block;

            color: #64748b;

            font-size: 13px;

            margin-bottom: 5px;
        }


        .summary-card strong {

            font-size: 23px;

            color: #1e293b;
        }


        /* =====================================
           TABLE CARD
        ====================================== */

        .table-card {

            background: #ffffff;

            border-radius: 12px;

            padding: 20px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.06);
        }


        .table-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }


        .table-header h3 {

            margin: 0;

            color: #1e293b;

            font-size: 18px;
        }


        #tableStatus {

            color: #64748b;

            font-size: 13px;
        }


        /* =====================================
           TABLE
        ====================================== */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;
        }


        table {

            width: 100%;

            min-width: 1250px;

            border-collapse: collapse;
        }


        th,
        td {

            padding: 11px 12px;

            border-bottom:
                1px solid #e2e8f0;

            text-align: left;

            white-space: nowrap;

            font-size: 13px;
        }


        th {

            background: #f8fafc;

            color: #475569;

            font-weight: bold;

            position: sticky;

            top: 0;

            z-index: 2;
        }


        tbody tr:hover {

            background: #f8fafc;
        }


        .emp-code {

            font-weight: bold;

            color: #2563eb;
        }


        .amount {

            font-weight: bold;

            color: #059669;
        }


        /* =====================================
           ENTRY SOURCE
        ====================================== */

        .entry-source {

            display: inline-block;

            padding: 4px 7px;

            border-radius: 5px;

            font-size: 11px;

            font-weight: bold;
        }


        .source-daily {

            background: #dbeafe;

            color: #1d4ed8;
        }


        .source-region {

            background: #dcfce7;

            color: #15803d;
        }


        /* =====================================
           NO DATA
        ====================================== */

        .no-data {

            text-align: center;

            padding: 30px;

            color: #94a3b8;
        }


        /* =====================================
           LOADING
        ====================================== */

        .loading {

            text-align: center;

            padding: 30px;

            color: #64748b;
        }


        /* =====================================
           ERROR
        ====================================== */

        .error-row {

            text-align: center;

            padding: 30px;

            color: #dc2626;
        }


        /* =====================================
           MOBILE
        ====================================== */

        @media (max-width: 1100px) {

            .filter-grid {

                grid-template-columns:
                    repeat(3, 1fr);
            }
        }


        @media (max-width: 800px) {

            .main {

                margin-left: 190px;

                width:
                    calc(100% - 190px);

                padding: 15px;
            }


            .filter-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .summary-grid {

                grid-template-columns: 1fr;
            }
        }


        @media (max-width: 550px) {

            .main {

                margin-left: 70px;

                width:
                    calc(100% - 70px);

                padding: 10px;
            }


            .topbar {

                padding: 16px;
            }


            .topbar h2 {

                font-size: 20px;
            }


            .filter-card {

                padding: 15px;
            }


            .filter-grid {

                grid-template-columns: 1fr;
            }


            .table-card {

                padding: 12px;
            }
        }

    </style>

</head>


<body>


<!-- =========================================
     ADMIN SIDEBAR CONTAINER

     IMPORTANT:
     Yahan sidebar ka HTML manually nahi hai.

     Existing:
     components/admin-sidebar.html

     Isi file ko load kiya jayega.
========================================= -->

<div id="adminSidebar"></div>



<!-- =========================================
     MAIN CONTENT
========================================= -->

<div class="main">


    <!-- =====================================
         TOPBAR
    ====================================== -->

    <div class="topbar">

        <h2>
            All Collection Entries
        </h2>

        <p>
            Filter and view all teacher collection entries
        </p>

    </div>



    <!-- =====================================
         FILTER CARD
    ====================================== -->

    <div class="filter-card">


        <div class="filter-title">

            <i class="fa-solid fa-filter"></i>

            <h3>
                Filter Entries
            </h3>

        </div>


        <div class="filter-grid">


            <!-- =================================
                 REGION
            ================================== -->

            <div class="filter-group">

                <label for="filterRegion">
                    Region
                </label>

                <select id="filterRegion">

                    <option value="">
                        All Regions
                    </option>

                </select>

            </div>



            <!-- =================================
                 STATE
            ================================== -->

            <div class="filter-group">

                <label for="filterState">
                    State
                </label>

                <select
                    id="filterState"
                    disabled
                >

                    <option value="">
                        All States
                    </option>

                </select>

            </div>



            <!-- =================================
                 CITY
            ================================== -->

            <div class="filter-group">

                <label for="filterCity">
                    City
                </label>

                <select
                    id="filterCity"
                    disabled
                >

                    <option value="">
                        All Cities
                    </option>

                </select>

            </div>



            <!-- =================================
                 EMPLOYEE CODE
            ================================== -->

            <div class="filter-group">

                <label for="filterEmployeeCode">
                    Employee Code
                </label>

                <input
                    type="text"
                    id="filterEmployeeCode"
                    placeholder="Enter Employee Code"
                    autocomplete="off"
                >

            </div>



            <!-- =================================
                 DATE
            ================================== -->

            <div class="filter-group">

                <label for="filterDate">
                    Date
                </label>

                <input
                    type="date"
                    id="filterDate"
                >

            </div>


        </div>



        <!-- =====================================
             FILTER BUTTON
        ====================================== -->

        <div class="filter-buttons">

            <button
                type="button"
                id="resetFilters"
                class="reset-btn"
            >

                <i class="fa-solid fa-rotate-left"></i>

                Reset Filters

            </button>

        </div>

    </div>



    <!-- =====================================
         SUMMARY
    ====================================== -->

    <div class="summary-grid">


        <!-- SHOWING ENTRIES -->

        <div class="summary-card">

            <span>
                Showing Entries
            </span>

            <strong id="allEntriesCount">
                0
            </strong>

        </div>



        <!-- TOTAL COLLECTION -->

        <div class="summary-card">

            <span>
                Total Collection
            </span>

            <strong id="allTotalAmount">
                ₹ 0
            </strong>

        </div>



        <!-- TODAY COLLECTION -->

        <div class="summary-card">

            <span>
                Today's Collection
            </span>

            <strong id="allTodayAmount">
                ₹ 0
            </strong>

        </div>


    </div>



    <!-- =====================================
         TABLE
    ====================================== -->

    <div class="table-card">


        <div class="table-header">

            <h3>
                Collection Entries
            </h3>


            <span id="tableStatus">
                Loading...
            </span>

        </div>



        <div class="table-wrapper">


            <table>


                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Employee Code
                        </th>

                        <th>
                            Teacher Name
                        </th>

                        <th>
                            Jamiatul Madina
                        </th>

                        <th>
                            City
                        </th>

                        <th>
                            State
                        </th>

                        <th>
                            Region
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Entry Source
                        </th>

                        <th>
                            Entry Time
                        </th>

                    </tr>

                </thead>



                <tbody id="allEntriesTableBody">

                    <tr>

                        <td
                            colspan="11"
                            class="loading"
                        >

                            Loading entries...

                        </td>

                    </tr>

                </tbody>


            </table>


        </div>


    </div>


</div>



<!-- =========================================
     LOAD ADMIN SIDEBAR
     
     IMPORTANT:
     Existing Admin Sidebar file will load here.
========================================= -->

<script>

(function () {

    const sidebarContainer =
        document.getElementById(
            "adminSidebar"
        );


    if (!sidebarContainer) {

        console.error(
            "Admin Sidebar container not found."
        );

        return;

    }


    fetch(
        "components/admin-sidebar.html"
    )

        .then(function (response) {

            if (!response.ok) {

                throw new Error(
                    "Admin Sidebar could not be loaded."
                );

            }

            return response.text();

        })

        .then(function (html) {

            sidebarContainer.innerHTML =
                html;


            /*
             * =================================
             * ACTIVE PAGE
             * =================================
             */

            const currentPage =
                window.location.pathname
                    .split("/")
                    .pop()
                    .toLowerCase();


            const menuLinks =
                sidebarContainer.querySelectorAll(
                    "a[data-page]"
                );


            menuLinks.forEach(
                function (link) {

                    const page =
                        (
                            link.getAttribute(
                                "data-page"
                            ) || ""
                        )
                            .toLowerCase();


                    link.classList.remove(
                        "active"
                    );


                    if (
                        page === currentPage
                    ) {

                        link.classList.add(
                            "active"
                        );

                    }

                }
            );


            /*
             * =================================
             * ADMIN LOGOUT
             * =================================
             */

            const logoutBtn =
                sidebarContainer.querySelector(
                    "#adminLogoutBtn"
                );


            if (logoutBtn) {

                logoutBtn.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();


                        localStorage.removeItem(
                            "loggedInEmpCode"
                        );


                        localStorage.removeItem(
                            "userRole"
                        );


                        localStorage.removeItem(
                            "adminLoggedIn"
                        );


                        window.location.href =
                            "index.html";

                    }
                );

            }

        })

        .catch(function (error) {

            console.error(
                "Admin Sidebar Error:",
                error
            );


            sidebarContainer.innerHTML = `

                <div style="
                    width:235px;
                    height:100vh;
                    position:fixed;
                    left:0;
                    top:0;
                    background:#0f172a;
                    color:#fff;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    text-align:center;
                    padding:20px;
                    z-index:9999;
                ">

                    <div>

                        <i
                            class="fa-solid fa-triangle-exclamation"
                            style="
                                font-size:30px;
                                margin-bottom:10px;
                            "
                        ></i>

                        <div>
                            Admin Sidebar Load Error
                        </div>

                    </div>

                </div>

            `;

        });

})();

</script>



<!-- =========================================
     ALL ENTRY JAVASCRIPT
========================================= -->

<script
    type="module"
    src="assets/js/all-entry.js"
></script>



<!-- =========================================
     PAGE PROTECTION
========================================= -->

<script
    type="module"
    src="assets/js/page-protection.js"
></script>


</body>

</html>
