<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Telethon - Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background: #f4f7fc;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        /* ==================================
           LOGIN BOX
        ================================== */

        .login-box {

            width: 100%;

            max-width: 400px;

            background: #ffffff;

            padding: 35px 30px;

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.10);

        }


        /* ==================================
           HEADING
        ================================== */

        .login-box h2 {

            text-align: center;

            margin-bottom: 8px;

            color: #0d6efd;

            font-size: 28px;

        }


        .login-box .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 25px;

        }


        /* ==================================
           FORM GROUP
        ================================== */

        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: bold;

        }


        /* ==================================
           INPUT
        ================================== */

        .form-group input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }


        .form-group input:focus {

            border-color: #0d6efd;

            box-shadow:
                0 0 0 3px rgba(13, 110, 253, 0.10);

        }


        /* ==================================
           LOGIN BUTTON
        ================================== */

        .login-btn {

            width: 100%;

            padding: 13px;

            background: #198754;

            color: #ffffff;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        .login-btn:hover {

            background: #157347;

        }


        .login-btn:disabled {

            background: #94a3b8;

            cursor: not-allowed;

        }


        .login-btn:active {

            transform: scale(0.99);

        }


        /* ==================================
           ERROR / MESSAGE
        ================================== */

        #errorMsg {

            margin-top: 15px;

            text-align: center;

            color: #dc3545;

            font-size: 14px;

            font-weight: bold;

            min-height: 20px;

        }


        /* ==================================
           REGISTER
        ================================== */

        .register-text {

            text-align: center;

            margin-top: 20px;

            color: #64748b;

            font-size: 14px;

        }


        .register-text a {

            color: #0d6efd;

            text-decoration: none;

            font-weight: bold;

        }


        .register-text a:hover {

            text-decoration: underline;

        }


        /* ==================================
           FOOTER
        ================================== */

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #94a3b8;

            font-size: 12px;

        }


        /* ==================================
           MOBILE
        ================================== */

        @media (max-width: 480px) {

            .login-box {

                padding: 28px 20px;

            }

            .login-box h2 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


    <!-- ==================================
         LOGIN BOX
    ================================== -->

    <div class="login-box">


        <h2>
            Telethon Login
        </h2>


        <p class="subtitle">
            Teacher & Admin Login
        </p>


        <!-- ==================================
             LOGIN FORM
        ================================== -->

        <form id="loginForm">


            <!-- Employee Code / Admin Email -->

            <div class="form-group">

                <label for="employeeCode">
                    Employee Code
                </label>

                <input
                    type="text"
                    id="employeeCode"
                    placeholder="Enter Employee Code"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >

                Login

            </button>


            <!-- Message -->

            <div id="errorMsg"></div>


        </form>


        <!-- ==================================
             REGISTRATION
        ================================== -->

        <div class="register-text">

            New Teacher?

            <a href="register.html">
                Register Here
            </a>

        </div>


        <!-- ==================================
             FOOTER
        ================================== -->

        <div class="footer">

            Telethon Management System

        </div>


    </div>


    <!-- ==================================
         AUTH JAVASCRIPT
    ================================== -->

    <script
        type="module"
        src="assets/js/auth.js"
    ></script>


</body>

</html>
