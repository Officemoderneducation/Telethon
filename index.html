<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telethon - Login</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <img src="assets/images/logo.png" alt="Logo" class="logo">

        <h2>Telethon</h2>
        <p>Fee Management System</p>

        <!-- Form tag added for proper submit handling -->
        <form id="loginForm">
            <!-- ID updated to empCode -->
            <input 
                type="text" 
                id="empCode" 
                placeholder="Enter Employee Code / Admin" 
                required>

            <input 
                type="password" 
                id="password" 
                placeholder="Enter Password" 
                required>

            <button type="submit" id="loginBtn">Login</button>
        </form>

        <!-- ID updated to errorMsg -->
        <p id="errorMsg" style="margin-top: 15px; font-weight: bold; color: red;"></p>
    </div>
</div>

<script type="module" src="./js/auth.js"></script>

</body>
</html>
