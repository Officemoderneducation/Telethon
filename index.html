<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telethoon Karkardagi</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f4f7fc;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            width:400px;
            background:#fff;
            padding:30px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,.15);
        }

        h1{
            color:#0b5ed7;
            margin-bottom:10px;
        }

        p{
            color:#555;
            margin-bottom:25px;
        }

        a{
            display:block;
            width:100%;
            padding:12px;
            margin:10px 0;
            text-decoration:none;
            color:#fff;
            border-radius:6px;
            font-weight:bold;
        }

        .teacher{
            background:#198754;
        }

        .admin{
            background:#0d6efd;
        }
    </style>
</head>
<body>

<div class="box">

    <h1>Telethoon Karkardagi</h1>

    <p>Academic Education Department</p>

    <a href="login.html" class="teacher">
        Teacher Login
    </a>

    <a href="admin-login.html" class="admin">
        Admin Login
    </a>

</div>

</body>
</html>
