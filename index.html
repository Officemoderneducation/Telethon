<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Telethoon - Login</title>


<link rel="stylesheet" href="assets/css/login.css">


</head>


<body>


<div class="login-container">


    <div class="login-box">


        <img src="assets/images/logo.png" 
        alt="Logo"
        class="logo">


        <h2>
            Telethoon
        </h2>

        <p>
            Fee Management System
        </p>


        <input 
        type="email" 
        id="email" 
        placeholder="Enter Email">


        <input 
        type="password" 
        id="password" 
        placeholder="Enter Password">


        <button id="loginBtn">
            Login
        </button>


        <p id="message"></p>


    </div>


</div>



<!-- index.html ke last me </body> tag se pehle -->
<script type="module" src="./js/auth.js"></script>


</body>

</html>
