<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daily Collection | Telethon</title>


    <!-- =====================================
         FONT AWESOME
    ====================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <style>

        /* =====================================
           RESET
        ====================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        /* =====================================
           BODY
        ====================================== */

        body {

            display: flex;

            min-height: 100vh;

            background: #f4f6f9;

            color: #1e293b;

        }


        /* =====================================
           SIDEBAR
        ====================================== */

        .sidebar {

            width: 225px;

            min-height: 100vh;

            background: #0f172a;

            color: #ffffff;

            flex-shrink: 0;

            position: fixed;

            left: 0;

            top: 0;

            bottom: 0;

            overflow-y: auto;

            z-index: 1000;

        }


        /* =====================================
           SIDEBAR LOGO
        ====================================== */

        .logo-section {

            height: 145px;

            padding: 14px 10px;

            text-align: center;

            border-bottom:
                1px solid #263247;

        }


        .logo-section img {

            width: 55px;

            height: 55px;

            object-fit: contain;

            display: block;

            margin: 0 auto 7px;

        }


        .logo-section h2 {

            font-size: 19px;

            color: #38bdf8;

            margin: 0;

        }


        .logo-section p {

            margin-top: 5px;

            font-size: 11px;

            color: #cbd5e1;

        }


        /* =====================================
           SIDEBAR MENU
        ====================================== */

        .menu {

            padding-top: 15px;

            display: flex;

            flex-direction: column;

        }


        .menu-title {

            padding:
                0 20px 8px;

            color: #64748b;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1px;

        }


        .menu a {

            display: flex;

            align-items: center;

            gap: 12px;

            width: 100%;

            padding: 12px 20px;

            color: #cbd5e1;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;

        }


        .menu a i {

            width: 18px;

            min-width: 18px;

            text-align: center;

            font-size: 15px;

        }


        .menu a:hover {

            background: #1e293b;

            color: #ffffff;

        }


        .menu a.active {

            background: #2563eb;

            color: #ffffff;

        }


        /* =====================================
           LOGOUT
        ====================================== */

        .logout-link {

            margin-top: 18px;

            color: #fca5a5 !important;

        }


        .logout-link:hover {

            background: #450a0a !important;

            color: #fecaca !important;

        }


        /* =====================================
           MAIN AREA
        ====================================== */

        .main-area {

            margin-left: 225px;

            flex: 1;

            min-width: 0;

            min-height: 100vh;

            padding: 20px 30px;

            overflow-y: auto;

        }


        /* =====================================
           HEADER
        ====================================== */

        .header-nav {

            display: flex;

            justify-content: space-between;

            align-items: center;

            width: 100%;

            max-width: 900px;

            margin: 0 auto 20px;

            background: #ffffff;

            padding: 14px 20px;

            border-radius: 8px;

            box-shadow:
                0 2px 5px rgba(0,0,0,0.05);

        }


        .user-info {

            display: flex;

            align-items: center;

            gap: 9px;

            font-weight: bold;

            color: #334155;

            font-size: 14px;

        }


        .user-info i {

            color: #2563eb;

            font-size: 18px;

        }


        .logout-btn {

            color: #dc3545;

            cursor: pointer;

            font-weight: bold;

            border: none;

            background: none;

            font-size: 14px;

        }


        .logout-btn:hover {

            color: #b91c1c;

        }


        /* =====================================
           FORM CONTAINER
        ====================================== */

        .form-container {

            width: 100%;

            max-width: 900px;

            margin: 0 auto 30px;

            background: #ffffff;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 4px 10px rgba(0,0,0,0.08);

        }


        .form-container h3 {

            margin-bottom: 20px;

            color: #2c3e50;

            text-align: center;

            font-size: 22px;

        }


        /* =====================================
           PERFORMANCE SUMMARY
        ====================================== */

        .performance-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;

            margin-bottom: 20px;

        }


        .performance-card {

            padding: 15px 10px;

            border-radius: 8px;

            text-align: center;

            background: #f8fafc;

            border: 1px solid #e2e8f0;

        }


        .performance-title {

            font-size: 12px;

            font-weight: bold;

            color: #64748b;

            margin-bottom: 7px;

        }


        .performance-value {

            font-size: 19px;

            font-weight: bold;

            color: #1e293b;

        }


        /* =====================================
           EMPLOYEE DETAILS
        ====================================== */

        .employee-badge {

            background-color: #e9ecef;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 18px;

            font-size: 13px;

            color: #495057;

            line-height: 1.7;

        }


        /* =====================================
           FORM GROUP
        ====================================== */

        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            margin-bottom: 6px;

            font-weight: bold;

            color: #555;

            font-size: 14px;

        }


        .form-group input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

        }


        .form-group input:focus {

            outline: none;

            border-color: #007bff;

            box-shadow:
                0 0 0 3px
                rgba(0,123,255,0.08);

        }


        /* =====================================
           SUBMIT BUTTON
        ====================================== */

        .submit-btn {

            width: 100%;

            padding: 12px;

            background-color: #28a745;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;

            font-weight: bold;

        }


        .submit-btn:hover {

            background-color: #218838;

        }


        .submit-btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;

        }


        /* =====================================
           MESSAGE
        ====================================== */

        #message {

            margin-top: 15px;

            text-align: center;

            font-weight: bold;

            font-size: 14px;

            min-height: 20px;

        }


        /* =====================================
           MOBILE MENU BUTTON
        ====================================== */

        .mobile-menu-btn {

            display: none;

            position: fixed;

            top: 12px;

            left: 12px;

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 18px;

            cursor: pointer;

            z-index: 1200;

        }


        /* =====================================
           MOBILE OVERLAY
        ====================================== */

        .sidebar-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.35);

            z-index: 900;

        }


        /* =====================================
           MOBILE
        ====================================== */

        @media (max-width: 800px) {

            .mobile-menu-btn {

                display: block;

            }


            .sidebar {

                width: 225px;

                transform:
                    translateX(-100%);

                transition:
                    transform 0.25s ease;

            }


            .sidebar.open {

                transform:
                    translateX(0);

            }


            .sidebar-overlay.show {

                display: block;

            }


            .main-area {

                margin-left: 0;

                padding:
                    65px 15px 20px;

            }


            .header-nav {

                max-width: 100%;

            }


            .form-container {

                max-width: 100%;

                padding: 25px 20px;

            }


            .performance-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        /* =====================================
           SMALL MOBILE
        ====================================== */

        @media (max-width: 500px) {

            .performance-grid {

                grid-template-columns: 1fr 1fr;

            }


            .performance-value {

                font-size: 16px;

            }


            .performance-title {

                font-size: 11px;

            }


            .header-nav {

                padding: 12px 14px;

            }


            .logout-btn {

                font-size: 12px;

            }


            .form-container {

                padding: 20px 15px;

            }


            .form-container h3 {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================
     MOBILE MENU BUTTON
====================================== -->

<button
    type="button"
    id="mobileMenuBtn"
    class="mobile-menu-btn"
    aria-label="Open Menu"
>

    <i class="fa-solid fa-bars"></i>

</button>


<!-- =====================================
     SIDEBAR OVERLAY
====================================== -->

<div
    id="sidebarOverlay"
    class="sidebar-overlay"
></div>


<!-- =====================================
     SIDEBAR
====================================== -->

<aside
    id="sidebar"
    class="sidebar"
>


    <!-- LOGO -->

    <div class="logo-section">

        <img
            src="assets/images/logo.png"
            alt="Telethon Logo"
        >

        <h2>
            Telethon
        </h2>

        <p>
            Teacher Panel
        </p>

    </div>


    <!-- MENU -->

    <nav class="menu">


        <div class="menu-title">
            Menu
        </div>


        <!-- DAILY COLLECTION -->

        <a
            href="daily-entry.html"
            class="active"
        >

            <i class="fa-solid fa-calendar-plus"></i>

            <span>
                Daily Collection
            </span>

        </a>


        <!-- LOGOUT -->

        <a
            href="index.html"
            id="logoutLink"
            class="logout-link"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>
                Logout
            </span>

        </a>


    </nav>

</aside>


<!-- =====================================
     MAIN AREA
====================================== -->

<div class="main-area">


    <!-- =================================
         HEADER
    ================================== -->

    <div class="header-nav">


        <span
            id="userInfo"
            class="user-info"
        >

            <i class="fa-solid fa-circle-user"></i>

            <span>
                Loading user...
            </span>

        </span>


        <button
            id="logoutBtnTop"
            class="logout-btn"
            type="button"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>


    </div>


    <!-- =================================
         DAILY ENTRY FORM
    ================================== -->

    <div class="form-container">


        <h3>
            Daily Collection Entry
        </h3>


        <!-- =================================
             PERFORMANCE SUMMARY
        ================================== -->

        <div class="performance-grid">


            <!-- TOTAL COLLECTION -->

            <div class="performance-card collection-card">

                <div class="performance-title">
                    Total Collection
                </div>

                <div
                    class="performance-value"
                    id="totalCollection"
                >
                    ₹ 0
                </div>

            </div>


            <!-- TARGET -->

            <div class="performance-card target-card">

                <div class="performance-title">
                    Target
                </div>

                <div
                    class="performance-value"
                    id="targetAmount"
                >
                    ₹ 0
                </div>

            </div>


            <!-- REMAINING TARGET -->

            <div class="performance-card remaining-card">

                <div class="performance-title">
                    Remaining Target
                </div>

                <div
                    class="performance-value"
                    id="remainingTarget"
                >
                    ₹ 0
                </div>

            </div>


            <!-- PERCENTAGE -->

            <div class="performance-card percentage-card">

                <div class="performance-title">
                    Percentage
                </div>

                <div
                    class="performance-value"
                    id="collectionPercentage"
                >
                    0%
                </div>

            </div>


        </div>


        <!-- =================================
             EMPLOYEE DETAILS
        ================================== -->

        <div
            id="employeeBadge"
            class="employee-badge"
            style="display:none;"
        >


            <div id="badgeTeacher">
                Teacher: -
            </div>


            <div id="badgeMadina">
                Jamiatul Madina: -
            </div>


            <div id="badgeLocation">
                Location: -
            </div>


        </div>


        <!-- =================================
             FORM
        ================================== -->

        <form id="dailyEntryForm">


            <!-- DATE -->

            <div class="form-group">

                <label for="entryDate">
                    Date
                </label>

                <input
                    type="date"
                    id="entryDate"
                    required
                >

            </div>


            <!-- AMOUNT -->

            <div class="form-group">

                <label for="amount">
                    Collection Amount (₹)
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter Amount"
                    min="1"
                    step="1"
                    required
                >

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                id="submitBtn"
                class="submit-btn"
            >

                <i class="fa-solid fa-paper-plane"></i>

                Submit Collection

            </button>


        </form>


        <!-- MESSAGE -->

        <div id="message"></div>


    </div>


</div>


<!-- =====================================
     SIDEBAR MOBILE JS
     Does NOT change daily-entry.js
====================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* ==============================
           ELEMENTS
        ============================== */

        const sidebar =
            document.getElementById("sidebar");

        const mobileMenuBtn =
            document.getElementById("mobileMenuBtn");

        const sidebarOverlay =
            document.getElementById("sidebarOverlay");

        const logoutBtnTop =
            document.getElementById("logoutBtnTop");

        const logoutLink =
            document.getElementById("logoutLink");


        /* ==============================
           OPEN SIDEBAR
        ============================== */

        if (mobileMenuBtn) {

            mobileMenuBtn.addEventListener(
                "click",
                function () {

                    sidebar.classList.toggle("open");

                    sidebarOverlay.classList.toggle("show");

                }
            );

        }


        /* ==============================
           CLOSE SIDEBAR
        ============================== */

        if (sidebarOverlay) {

            sidebarOverlay.addEventListener(
                "click",
                function () {

                    sidebar.classList.remove("open");

                    sidebarOverlay.classList.remove("show");

                }
            );

        }


        /* ==============================
           LOGOUT FUNCTION
        ============================== */

        function logoutUser() {

            localStorage.removeItem(
                "loggedInEmpCode"
            );

            localStorage.removeItem(
                "userRole"
            );

            localStorage.removeItem(
                "regionUserName"
            );

            localStorage.removeItem(
                "regionUserAccess"
            );

            window.location.href =
                "index.html";

        }


        /* ==============================
           TOP LOGOUT
        ============================== */

        if (logoutBtnTop) {

            logoutBtnTop.addEventListener(
                "click",
                function () {

                    logoutUser();

                }
            );

        }


        /* ==============================
           SIDEBAR LOGOUT
        ============================== */

        if (logoutLink) {

            logoutLink.addEventListener(
                "click",
                function (e) {

                    e.preventDefault();

                    logoutUser();

                }
            );

        }


    }
);

</script>


<!-- =====================================
     EXISTING DAILY ENTRY JS
     
     IMPORTANT:
     DO NOT CHANGE
====================================== -->

<script
    type="module"
    src="assets/js/daily-entry.js?v=3"
></script>


</body>

</html>
