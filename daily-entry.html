<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Collection Entry</title>
    
    <!-- CSS Link (Apni stylesheet yahan connect karein) -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Basic Form Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .form-container h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .submit-btn:hover {
            background-color: #218838;
        }
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
        }
        .logout-link {
            color: #dc3545;
            cursor: pointer;
            text-decoration: underline;
            font-weight: bold;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Header / Logout -->
    <div class="header-nav">
        <span>Logged in Employee</span>
        <span id="logoutBtn" class="logout-link">Logout</span>
    </div>

    <!-- Daily Entry Form Container -->
    <div class="form-container">
        <h2>Daily Collection Entry</h2>
        
        <form id="dailyEntryForm">
            <!-- Date -->
            <div class="form-group">
                <label for="entryDate">Date</label>
                <input type="date" id="entryDate" required>
            </div>

            <!-- Teacher / Employee Name -->
            <div class="form-group">
                <label for="teacherName">Teacher / Employee Name</label>
                <input type="text" id="teacherName" placeholder="Enter full name" required>
            </div>

            <!-- Region -->
            <div class="form-group">
                <label for="region">Region / Area</label>
                <input type="text" id="region" placeholder="e.g. North Zone, Jaipur" required>
            </div>

            <!-- Collection Amount -->
            <div class="form-group">
                <label for="amount">Collection Amount (₹)</label>
                <input type="number" id="amount" placeholder="Enter amount" min="0" required>
            </div>

            <!-- Status -->
            <div class="form-group">
                <label for="status">Payment Status</label>
                <select id="status">
                    <option value="Success" selected>Success</option>
                    <option value="Pending">Pending</option>
                </select>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="submit-btn">Submit Entry</button>
        </form>

        <div id="message"></div>
    </div>

    <!-- JS Script Link -->
    <script type="module" src="daily-entry.js"></script>
</body>
</html>
