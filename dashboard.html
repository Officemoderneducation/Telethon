<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 4px solid #007bff;
        }

        .dashboard-card h5 {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .dashboard-card h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }

        .dashboard-card span {
            font-size: 12px;
            color: #888;
        }

        .table-section {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .table-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        table th, table td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }

        table th {
            background-color: #f8f9fa;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="dashboard-header">
        <h2>Admin Dashboard</h2>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </header>

    <!-- Dashboard Cards Grid -->
    <div class="dashboard-grid">

        <!-- Total Target -->
        <div class="dashboard-card">
            <div>
                <h5>Total Target Amount</h5>
                <h2 id="totalTarget">₹0</h2>
                <span>All Users Target</span>
            </div>
        </div>

        <!-- Total Collection -->
        <div class="dashboard-card">
            <div>
                <h5>Total Collection Amount</h5>
                <h2 id="totalCollection">₹0</h2>
                <span>Lifetime Collection</span>
            </div>
        </div>

        <!-- Today's Collection -->
        <div class="dashboard-card">
            <div>
                <h5>Today's Collection</h5>
                <h2 id="todayCollection">₹0</h2>
                <span>Today's Total Entry</span>
            </div>
        </div>

        <!-- Total Users -->
        <div class="dashboard-card">
            <div>
                <h5>Total Users</h5>
                <h2 id="totalUsers">0</h2>
                <span>Registered Employees</span>
            </div>
        </div>

    </div>

    <!-- Data Table Section -->
    <section class="table-section">
        <h3>Recent Daily Entries</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Teacher Name</th>
                        <th>Region</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="recentTable">
                    <!-- Data will load here via JS -->
                </tbody>
            </table>
        </div>
    </section>

    <!-- JS Module Script Connection -->
    <script type="module" src="dashboard.js"></script>
</body>
</html>
