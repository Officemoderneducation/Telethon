<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="dashboard-header">
        <h2>Admin Dashboard</h2>
        <button id="logoutBtn" class="logout-btn">Logout</button>
    </header>

    <main class="dashboard-container">
        <!-- Dashboard Cards -->
        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div>
                    <h5>Total Target Amount</h5>
                    <h2 id="totalTarget">₹0</h2>
                    <span>All Users Target</span>
                </div>
            </div>

            <div class="dashboard-card">
                <div>
                    <h5>Total Collection Amount</h5>
                    <h2 id="totalCollection">₹0</h2>
                    <span>Lifetime Collection</span>
                </div>
            </div>

            <div class="dashboard-card">
                <div>
                    <h5>Today's Collection</h5>
                    <h2 id="todayCollection">₹0</h2>
                    <span>Today's Total Entry</span>
                </div>
            </div>

            <div class="dashboard-card">
                <div>
                    <h5>Total Users</h5>
                    <h2 id="totalUsers">0</h2>
                    <span>Registered Employees</span>
                </div>
            </div>
        </div>

        <!-- Table Section -->
        <section class="table-section">
            <h3>Recent Daily Entries</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Teacher Name</th>
                            <th>Region</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="recentTable">
                        <!-- JS Data automatically loads here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- MUST BE type="module" -->
    <script type="module" src="dashboard.js"></script>
</body>
</html>
