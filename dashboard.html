<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Collection Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .header h2 {
            color: #2c3e50;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 5px solid #007bff;
        }

        .stat-card.today { border-left-color: #28a745; }
        .stat-card.count { border-left-color: #ffc107; }

        .stat-card h4 {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .stat-card p {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .table-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow-x: auto;
        }

        .table-container h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }

        th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f1f3f5;
        }

        .no-data {
            text-align: center;
            color: #888;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Header -->
        <div class="header">
            <h2>Collection Dashboard</h2>
            <button onclick="window.location.reload()" style="padding: 8px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px;">Refresh</button>
        </div>

        <!-- Summary Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>Total Collection</h4>
                <p id="totalAmount">₹ 0</p>
            </div>
            <div class="stat-card today">
                <h4>Today's Collection</h4>
                <p id="todayAmount">₹ 0</p>
            </div>
            <div class="stat-card count">
                <h4>Total Entries</h4>
                <p id="totalEntriesCount">0</p>
            </div>
        </div>

        <!-- Live Entries Table -->
        <div class="table-container">
            <h3>Recent Collection Entries</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Emp Code</th>
                        <th>Teacher Name</th>
                        <th>Jamiatul Madina</th>
                        <th>City / State</th>
                        <th>Region</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="entriesTableBody">
                    <tr>
                        <td colspan="7" class="no-data">Loading entries...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Connected with js/dashboard.js -->
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
