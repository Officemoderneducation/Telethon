<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Telethon Admin Dashboard</title>


    <!-- ==========================================
         FONT AWESOME
    =========================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- ==========================================
         DASHBOARD CSS
    =========================================== -->

    <link
        rel="stylesheet"
        href="assets/css/dashboard.css"
    >


    <!-- ==========================================
         ADMIN SIDEBAR CSS
    =========================================== -->

    <link
        rel="stylesheet"
        href="components/admin-sidebar.css"
    >


    <!-- ==========================================
         HTML2CANVAS
         Used for Dashboard Image Download
    =========================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
    ></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            background: #f4f7fb;
        }


        /* ==========================================
           MAIN CONTENT
        =========================================== */

        .main-content {

            margin-left: 260px;

            padding: 30px;

            min-height: 100vh;

            background: #f4f7fb;
        }


        /* ==========================================
           DASHBOARD CAPTURE AREA
        =========================================== */

        #dashboardCaptureArea {

            width: 100%;

            background: #f4f7fb;

            padding: 0;

        }


        /* ==========================================
           SUMMARY CARDS
        =========================================== */

        .user-summary-cards {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }


        .user-summary-card {

            background: #ffffff;

            border-radius: 18px;

            padding: 20px;

            display: flex;

            align-items: center;

            gap: 16px;

            border: 1px solid #e8edf5;

            box-shadow:
                0 7px 25px rgba(
                    15,
                    23,
                    42,
                    0.06
                );
        }


        .summary-card-icon {

            width: 54px;

            height: 54px;

            min-width: 54px;

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;
        }


        .summary-card-icon.target {

            background: #fff4cf;

            color: #e5a900;
        }


        .summary-card-icon.collection {

            background: #dcfce7;

            color: #16a34a;
        }


        .summary-card-icon.remaining {

            background: #fee2e2;

            color: #dc2626;
        }


        .summary-card-icon.percent {

            background: #e0e7ff;

            color: #4f46e5;
        }


        .user-summary-card span {

            display: block;

            color: #718096;

            font-size: 13px;

            margin-bottom: 5px;
        }


        .user-summary-card strong {

            display: block;

            font-size: 20px;

            color: #172033;

            font-weight: 700;
        }


        .summary-unit {

            display: block;

            margin-top: 4px;

            color: #64748b;

            font-size: 12px;

            font-weight: 600;
        }


        /* ==========================================
           ACADEMIC DEPARTMENT SUMMARY
        =========================================== */

        .user-summary-container {

            background: #ffffff;

            border-radius: 18px;

            border: 1px solid #e8edf5;

            box-shadow:
                0 7px 25px rgba(
                    15,
                    23,
                    42,
                    0.06
                );

            overflow: hidden;

            margin-bottom: 25px;
        }


        /* ==========================================
           SECTION HEADER
        =========================================== */

        .section-header {

            padding: 20px 22px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            border-bottom: 1px solid #edf1f7;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #f9fbff
                );
        }


        .section-header h3 {

            margin: 0;

            color: #172033;

            font-size: 18px;

            font-weight: 700;
        }


        .section-header h3 i {

            color: #2563eb;

            margin-right: 7px;
        }


        .section-header p {

            margin: 5px 0 0;

            color: #8490a5;

            font-size: 12px;
        }


        /* ==========================================
           DOWNLOAD IMAGE BUTTON
        =========================================== */

        .download-dashboard-image-btn {

            border: none;

            background: #2563eb;

            color: #ffffff;

            height: 42px;

            padding: 0 16px;

            border-radius: 9px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 5px 15px rgba(
                    37,
                    99,
                    235,
                    0.20
                );

            transition:
                all 0.2s ease;

            white-space: nowrap;
        }


        .download-dashboard-image-btn:hover {

            background: #1d4ed8;

            transform: translateY(-1px);

            box-shadow:
                0 7px 18px rgba(
                    37,
                    99,
                    235,
                    0.28
                );
        }


        .download-dashboard-image-btn:active {

            transform: translateY(0);
        }


        .download-dashboard-image-btn:disabled {

            opacity: 0.7;

            cursor: wait;

            transform: none;
        }


        /* ==========================================
           TABLE
        =========================================== */

        .user-summary-table-wrapper {

            overflow-x: auto;

            padding: 0 18px 18px;
        }


        .user-summary-table {

            width: 100%;

            border-collapse: separate;

            border-spacing: 0;

            min-width: 800px;
        }


        .user-summary-table thead th {

            background: #f7f9fc;

            color: #5d687b;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.3px;

            padding: 14px 12px;

            border-bottom: 1px solid #e5eaf1;

            white-space: nowrap;

            text-align: left;
        }


        .user-summary-table tbody td {

            padding: 16px 12px;

            border-bottom: 1px solid #edf1f6;

            color: #273449;

            font-size: 13px;

            vertical-align: middle;
        }


        .user-summary-table tbody tr:hover {

            background: #f8fbff;
        }


        /* ==========================================
           USER NAME
        =========================================== */

        .user-name-input {

            width: 180px;

            height: 38px;

            border: 1px solid #d6deea;

            border-radius: 8px;

            padding: 0 10px;

            outline: none;

            font-size: 13px;

            font-weight: 600;

            color: #172033;
        }


        .user-name-input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.10
                );
        }


        /* ==========================================
           TARGET UNIT EDIT
        =========================================== */

        .target-edit-box {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .user-target-input {

            width: 105px;

            height: 38px;

            border: 1px solid #d6deea;

            border-radius: 8px;

            padding: 0 10px;

            outline: none;

            font-size: 13px;

            font-weight: 600;

            color: #172033;
        }


        .user-target-input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(
                    37,
                    99,
                    235,
                    0.10
                );
        }


        .unit-input-label {

            font-size: 12px;

            color: #64748b;

            font-weight: 600;
        }


        .save-user-target-btn {

            width: 38px;

            height: 38px;

            border: none;

            border-radius: 8px;

            background: #16a34a;

            color: white;

            cursor: pointer;

            transition: 0.2s;
        }


        .save-user-target-btn:hover {

            background: #15803d;

            transform: translateY(-1px);
        }


        /* ==========================================
           UNIT DISPLAY
        =========================================== */

        .unit-main {

            display: block;

            font-size: 14px;

            font-weight: 700;

            white-space: nowrap;
        }


        .target-main {

            color: #2563eb;
        }


        .collection-main {

            color: #16a34a;
        }


        .remaining-main {

            color: #dc2626;
        }


        /* ==========================================
           PERCENTAGE
        =========================================== */

        .percentage-wrapper {

            min-width: 150px;
        }


        .percentage-badge {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;

            margin-bottom: 7px;
        }


        .percentage-badge.low {

            background: #fee2e2;

            color: #dc2626;
        }


        .percentage-badge.medium {

            background: #fef3c7;

            color: #b45309;
        }


        .percentage-badge.good {

            background: #dbeafe;

            color: #2563eb;
        }


        .percentage-badge.complete {

            background: #dcfce7;

            color: #15803d;
        }


        .user-progress-container {

            width: 100%;

            height: 7px;

            background: #e5e7eb;

            border-radius: 20px;

            overflow: hidden;
        }


        .user-progress-bar {

            height: 100%;

            border-radius: 20px;

            transition: width 0.5s ease;
        }


        .user-progress-bar.low {

            background: #ef4444;
        }


        .user-progress-bar.medium {

            background: #f59e0b;
        }


        .user-progress-bar.good {

            background: #3b82f6;
        }


        .user-progress-bar.complete {

            background: #16a34a;
        }


        /* ==========================================
           NO DATA
        =========================================== */

        .no-data {

            text-align: center;

            color: #718096;

            padding: 30px !important;
        }


        /* ==========================================
           MOBILE / TABLET
        =========================================== */

        @media (max-width: 1100px) {

            .user-summary-cards {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 768px) {

            .main-content {

                margin-left: 0;

                padding: 15px;
            }


            .user-summary-cards {

                grid-template-columns: 1fr;
            }


            .section-header {

                flex-direction: column;

                align-items: flex-start;
            }


            .download-dashboard-image-btn {

                width: 100%;
            }


            .user-name-input {

                width: 150px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         ADMIN SIDEBAR
    =========================================== -->

    <div id="adminSidebar"></div>


    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->

    <main class="main-content">


        <!-- ======================================
             DASHBOARD IMAGE CAPTURE AREA
        ======================================= -->

        <div id="dashboardCaptureArea">


            <!-- ======================================
                 SUMMARY CARDS
            ======================================= -->

            <div class="user-summary-cards">


                <!-- TOTAL TARGET -->

                <div class="user-summary-card">

                    <div
                        class="summary-card-icon target"
                    >

                        <i
                            class="fa-solid fa-bullseye"
                        ></i>

                    </div>

                    <div>

                        <span>Total Target</span>

                        <strong
                            id="userSummaryTotalTarget"
                        >
                            0 Unit
                        </strong>

                    </div>

                </div>


                <!-- TOTAL COLLECTION -->

                <div class="user-summary-card">

                    <div
                        class="
                            summary-card-icon
                            collection
                        "
                    >

                        <i
                            class="fa-solid fa-chart-column"
                        ></i>

                    </div>

                    <div>

                        <span>Total Collection</span>

                        <strong
                            id="userSummaryTotalCollection"
                        >
                            0 Unit
                        </strong>

                    </div>

                </div>


                <!-- REMAINING -->

                <div class="user-summary-card">

                    <div
                        class="
                            summary-card-icon
                            remaining
                        "
                    >

                        <i
                            class="fa-solid fa-chart-line"
                        ></i>

                    </div>

                    <div>

                        <span>Remaining Target</span>

                        <strong
                            id="userSummaryTotalRemaining"
                        >
                            0 Unit
                        </strong>

                    </div>

                </div>


                <!-- PERCENTAGE -->

                <div class="user-summary-card">

                    <div
                        class="
                            summary-card-icon
                            percent
                        "
                    >

                        <i
                            class="fa-solid fa-percent"
                        ></i>

                    </div>

                    <div>

                        <span>Overall Percentage</span>

                        <strong
                            id="userSummaryTotalPercentage"
                        >
                            0.00%
                        </strong>

                    </div>

                </div>


            </div>


            <!-- ======================================
                 ACADEMIC DEPARTMENT
            ======================================= -->

            <div class="user-summary-container">


                <!-- SECTION HEADER -->

                <div class="section-header">


                    <div>

                        <h3>

                            <i
                                class="
                                    fa-solid
                                    fa-building-columns
                                "
                            ></i>

                            Academic Department,
                            Jamiatul Madina

                        </h3>

                        <p>
                            User-wise target and
                            collection performance
                        </p>

                    </div>


                    <!-- ==================================
                         DOWNLOAD IMAGE BUTTON
                    =================================== -->

                    <button
                        type="button"
                        id="downloadDashboardImageBtn"
                        class="
                            download-dashboard-image-btn
                        "
                        data-html2canvas-ignore="true"
                        title="Download Dashboard Data as Image"
                    >

                        <i
                            class="fa-solid fa-image"
                        ></i>

                        Download Image

                    </button>


                </div>


                <!-- ======================================
                     TABLE
                ======================================= -->

                <div
                    class="
                        user-summary-table-wrapper
                    "
                >

                    <table
                        class="user-summary-table"
                    >

                        <thead>

                            <tr>

                                <th>#</th>

                                <th>User Name</th>

                                <th>Target Unit</th>

                                <th>Total Collection</th>

                                <th>Remaining Target</th>

                                <th>Percentage</th>

                            </tr>

                        </thead>


                        <tbody
                            id="userSummaryTableBody"
                        >

                            <tr>

                                <td
                                    colspan="6"
                                    class="no-data"
                                >

                                    Loading User
                                    Summary...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>


            </div>


        </div>


    </main>


    <!-- ==========================================
         LOAD ADMIN SIDEBAR
    =========================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                fetch(
                    "components/admin-sidebar.html"
                )

                    .then(
                        function (response) {

                            if (!response.ok) {

                                throw new Error(
                                    "Admin Sidebar not found: " +
                                    response.status
                                );

                            }

                            return response.text();

                        }
                    )

                    .then(
                        function (data) {

                            const sidebar =
                                document.getElementById(
                                    "adminSidebar"
                                );


                            if (!sidebar) {
                                return;
                            }


                            sidebar.innerHTML =
                                data;


                            /* ==============================
                               ACTIVE PAGE
                            ============================== */

                            let currentPage =
                                window.location.pathname
                                    .split("/")
                                    .pop()
                                    .toLowerCase();


                            if (
                                !currentPage ||
                                currentPage === ""
                            ) {

                                currentPage =
                                    "dashboard.html";

                            }


                            const menuLinks =
                                sidebar.querySelectorAll(
                                    ".admin-sidebar-menu a[data-page]"
                                );


                            menuLinks.forEach(
                                function (link) {

                                    const page =
                                        link
                                            .getAttribute(
                                                "data-page"
                                            )
                                            .toLowerCase();


                                    if (
                                        page ===
                                        currentPage
                                    ) {

                                        link.classList.add(
                                            "active"
                                        );

                                    }

                                    else {

                                        link.classList.remove(
                                            "active"
                                        );

                                    }

                                }
                            );


                            /* ==============================
                               LOGOUT
                            ============================== */

                            const logoutBtn =
                                sidebar.querySelector(
                                    "#adminLogoutBtn"
                                );


                            if (logoutBtn) {

                                logoutBtn.addEventListener(
                                    "click",
                                    function (e) {

                                        e.preventDefault();


                                        localStorage.removeItem(
                                            "loggedInEmpCode"
                                        );

                                        localStorage.removeItem(
                                            "userRole"
                                        );

                                        localStorage.removeItem(
                                            "adminLoggedIn"
                                        );

                                        localStorage.removeItem(
                                            "isAdmin"
                                        );


                                        window.location.href =
                                            "index.html";

                                    }
                                );

                            }

                        }
                    )

                    .catch(
                        function (error) {

                            console.error(
                                "Admin Sidebar Error:",
                                error
                            );

                        }
                    );

            }
        );

    </script>


    <!-- ==========================================
         DASHBOARD JS
    =========================================== -->

    <script
        type="module"
        src="assets/js/dashboard.js"
    ></script>


    <!-- ==========================================
         PAGE PROTECTION
    =========================================== -->

    <script
        type="module"
        src="assets/js/page-protection.js"
    ></script>


</body>

</html>
