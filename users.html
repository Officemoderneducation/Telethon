<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teachers List | Telethon</title>


    <!-- ======================================
         FONT AWESOME
    ======================================= -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- ======================================
         ADMIN SIDEBAR CSS
    ======================================= -->

    <link
        rel="stylesheet"
        href="components/admin-sidebar.css"
    >


    <style>

        /* ======================================
           RESET
        ======================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* ======================================
           BODY
        ======================================= */

        body {

            min-height: 100vh;

            background: #f4f6f9;

            color: #1e293b;
        }


        /* ======================================
           MAIN AREA
        ======================================= */

        .main {

            margin-left: 260px;

            width: calc(100% - 260px);

            min-height: 100vh;

            padding: 24px;
        }


        /* ======================================
           TOPBAR
        ======================================= */

        .topbar {

            background: #ffffff;

            border-radius: 12px;

            padding: 20px 24px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.06);
        }


        .topbar h2 {

            font-size: 24px;

            color: #0f172a;

            margin-bottom: 5px;
        }


        .topbar p {

            color: #64748b;

            font-size: 14px;
        }


        /* ======================================
           TABLE CONTAINER
        ======================================= */

        .table-container {

            background: #ffffff;

            border-radius: 12px;

            padding: 20px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.06);

            width: 100%;

            overflow: hidden;
        }


        /* ======================================
           TABLE HEADER
        ======================================= */

        .table-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 18px;
        }


        .table-header h3 {

            font-size: 18px;

            color: #0f172a;

            white-space: nowrap;
        }


        /* ======================================
           SEARCH
        ======================================= */

        .search-box {

            width: 280px;

            max-width: 100%;

            padding: 11px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 7px;

            outline: none;

            font-size: 14px;

            background: #ffffff;
        }


        .search-box:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }


        /* ======================================
           FILTER CARD
        ======================================= */

        .filter-card {

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 10px;

            padding: 16px;

            margin-bottom: 18px;
        }


        .filter-title {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 14px;

            color: #0f172a;

            font-size: 15px;

            font-weight: bold;
        }


        .filter-title i {

            color: #2563eb;
        }


        .filter-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;
        }


        .filter-group {

            display: flex;

            flex-direction: column;

        }


        .filter-group label {

            margin-bottom: 6px;

            font-size: 12px;

            font-weight: bold;

            color: #475569;
        }


        .filter-select {

            width: 100%;

            height: 40px;

            padding: 0 10px;

            border: 1px solid #cbd5e1;

            border-radius: 7px;

            background: #ffffff;

            color: #334155;

            font-size: 13px;

            outline: none;

            cursor: pointer;
        }


        .filter-select:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }


        .filter-select:disabled {

            background: #f1f5f9;

            color: #94a3b8;

            cursor: not-allowed;
        }


        .filter-actions {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 14px;
        }


        .reset-filter-btn {

            border: none;

            background: #64748b;

            color: #ffffff;

            padding: 9px 15px;

            border-radius: 7px;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;
        }


        .reset-filter-btn:hover {

            background: #475569;
        }


        /* ======================================
           FILTER RESULT
        ======================================= */

        .filter-result {

            font-size: 12px;

            color: #64748b;

            font-weight: 600;
        }


        /* ======================================
           TABLE WRAPPER
        ======================================= */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;

            border: 1px solid #e2e8f0;

            border-radius: 7px;
        }


        /* ======================================
           TABLE
        ======================================= */

        table {

            width: 100%;

            min-width: 1000px;

            border-collapse: collapse;

            background: #ffffff;
        }


        th {

            background: #2563eb;

            color: #ffffff;

            padding: 13px 14px;

            text-align: left;

            font-size: 13px;

            font-weight: bold;

            white-space: nowrap;
        }


        td {

            padding: 13px 14px;

            border-bottom: 1px solid #e2e8f0;

            font-size: 14px;

            color: #334155;

            white-space: nowrap;
        }


        tbody tr:hover {

            background: #f8fafc;
        }


        tbody tr:last-child td {

            border-bottom: none;
        }


        /* ======================================
           EMPLOYEE CODE
        ======================================= */

        .employee-code {

            font-weight: bold;

            color: #1d4ed8;
        }


        /* ======================================
           STATUS
        ======================================= */

        .status-badge {

            display: inline-block;

            padding: 5px 11px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }


        .status-badge.approved {

            background: #d1e7dd;

            color: #0f5132;
        }


        .status-badge.pending {

            background: #fff3cd;

            color: #664d03;
        }


        /* ======================================
           ACTION BUTTONS
        ======================================= */

        .action-btn {

            border: none;

            padding: 7px 12px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 12px;

            font-weight: bold;

            transition: 0.2s;
        }


        .approve-btn {

            background: #198754;

            color: #ffffff;
        }


        .approve-btn:hover {

            background: #157347;
        }


        .pending-btn {

            background: #ffc107;

            color: #000000;
        }


        .pending-btn:hover {

            background: #e0a800;
        }


        /* ======================================
           DELETE BUTTON
        ======================================= */

        .delete-btn {

            background: #dc3545;

            color: #ffffff;

            border: none;

            padding: 7px 12px;

            border-radius: 5px;

            cursor: pointer;

            margin-left: 5px;

            font-size: 12px;

            font-weight: bold;

            transition: 0.2s;
        }


        .delete-btn:hover {

            background: #b02a37;
        }


        /* ======================================
           LOADING / EMPTY / ERROR
        ======================================= */

        .loading-cell,
        .empty-cell,
        .error-cell {

            text-align: center;

            padding: 30px !important;

            font-size: 14px;
        }


        .loading-cell {

            color: #64748b;
        }


        .empty-cell {

            color: #64748b;
        }


        .error-cell {

            color: #dc3545;
        }


        /* ======================================
           MOBILE
        ======================================= */

        @media (max-width: 1000px) {

            .filter-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 768px) {

            .main {

                margin-left: 70px;

                width: calc(100% - 70px);

                padding: 15px;
            }


            .table-header {

                flex-direction: column;

                align-items: stretch;
            }


            .search-box {

                width: 100%;
            }


            .topbar h2 {

                font-size: 20px;
            }


            .filter-grid {

                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 550px) {

            .main {

                margin-left: 70px;

                width: calc(100% - 70px);

                padding: 10px;
            }


            .table-container {

                padding: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- ======================================
         ADMIN SIDEBAR
    ======================================= -->

    <div id="adminSidebar"></div>


    <!-- ======================================
         MAIN
    ======================================= -->

    <main class="main">


        <!-- ==================================
             TOPBAR
        =================================== -->

        <div class="topbar">

            <h2>
                Teacher Management
            </h2>

            <p>
                Registered Teachers
            </p>

        </div>


        <!-- ==================================
             TABLE
        =================================== -->

        <div class="table-container">


            <div class="table-header">

                <h3>
                    Registered Teachers
                </h3>


                <input
                    type="text"
                    id="searchUser"
                    class="search-box"
                    placeholder="Search Teacher..."
                    autocomplete="off"
                >

            </div>


            <!-- ==================================
                 FILTERS
            =================================== -->

            <div class="filter-card">

                <div class="filter-title">

                    <i class="fa-solid fa-filter"></i>

                    <span>Filter Teachers</span>

                </div>


                <div class="filter-grid">


                    <!-- REGION -->

                    <div class="filter-group">

                        <label for="filterRegion">
                            Region
                        </label>

                        <select
                            id="filterRegion"
                            class="filter-select"
                        >

                            <option value="">
                                All Regions
                            </option>

                        </select>

                    </div>


                    <!-- STATE -->

                    <div class="filter-group">

                        <label for="filterState">
                            State
                        </label>

                        <select
                            id="filterState"
                            class="filter-select"
                            disabled
                        >

                            <option value="">
                                All States
                            </option>

                        </select>

                    </div>


                    <!-- CITY -->

                    <div class="filter-group">

                        <label for="filterCity">
                            City
                        </label>

                        <select
                            id="filterCity"
                            class="filter-select"
                            disabled
                        >

                            <option value="">
                                All Cities
                            </option>

                        </select>

                    </div>


                    <!-- STATUS -->

                    <div class="filter-group">

                        <label for="filterStatus">
                            Status
                        </label>

                        <select
                            id="filterStatus"
                            class="filter-select"
                        >

                            <option value="">
                                All Status
                            </option>

                            <option value="approved">
                                Approved
                            </option>

                            <option value="pending">
                                Pending
                            </option>

                        </select>

                    </div>

                </div>


                <div class="filter-actions">

                    <button
                        type="button"
                        id="resetFilters"
                        class="reset-filter-btn"
                    >

                        <i class="fa-solid fa-rotate-left"></i>

                        Reset Filters

                    </button>


                    <span
                        id="filterResult"
                        class="filter-result"
                    >
                        Showing all teachers
                    </span>

                </div>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Employee Code
                            </th>

                            <th>
                                Teacher Name
                            </th>

                            <th>
                                Mobile
                            </th>

                            <th>
                                Region
                            </th>

                            <th>
                                State
                            </th>

                            <th>
                                City
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="usersTable">

                        <tr>

                            <td
                                colspan="8"
                                class="loading-cell"
                            >
                                Loading Teachers...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


    </main>


    <!-- ======================================
         LOAD ADMIN SIDEBAR
    ======================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                fetch("components/admin-sidebar.html")

                    .then(function (response) {

                        if (!response.ok) {

                            throw new Error(
                                "Admin Sidebar not found: " +
                                response.status
                            );

                        }

                        return response.text();

                    })


                    .then(function (data) {

                        const sidebar =
                            document.getElementById(
                                "adminSidebar"
                            );


                        if (!sidebar) {
                            return;
                        }


                        sidebar.innerHTML = data;


                        /* =================================
                           ACTIVE PAGE
                        ================================= */

                        let currentPage =
                            window.location.pathname
                                .split("/")
                                .pop()
                                .toLowerCase();


                        if (
                            !currentPage ||
                            currentPage === ""
                        ) {

                            currentPage =
                                "dashboard.html";

                        }


                        const menuLinks =
                            sidebar.querySelectorAll(
                                "a[data-page]"
                            );


                        menuLinks.forEach(
                            function (link) {

                                const page =
                                    link
                                        .getAttribute(
                                            "data-page"
                                        )
                                        .toLowerCase();


                                if (
                                    page ===
                                    currentPage
                                ) {

                                    link.classList.add(
                                        "active"
                                    );

                                }

                                else {

                                    link.classList.remove(
                                        "active"
                                    );

                                }

                            }
                        );


                        /* =================================
                           LOGOUT
                        ================================= */

                        const logoutBtn =
                            sidebar.querySelector(
                                "#adminLogoutBtn"
                            );


                        if (logoutBtn) {

                            logoutBtn.addEventListener(
                                "click",
                                function (e) {

                                    e.preventDefault();

                                    e.stopPropagation();


                                    localStorage.removeItem(
                                        "loggedInEmpCode"
                                    );

                                    localStorage.removeItem(
                                        "userRole"
                                    );


                                    window.location.replace(
                                        "index.html"
                                    );

                                }
                            );

                        }

                    })


                    .catch(function (error) {

                        console.error(
                            "Admin Sidebar Error:",
                            error
                        );

                    });

            }

        );

    </script>


    <!-- ======================================
         FIREBASE CONFIG
    ======================================= -->

    <script
        type="module"
        src="assets/js/firebase-config.js"
    ></script>


    <!-- ======================================
         AUTH
    ======================================= -->

    <script
        type="module"
        src="assets/js/auth.js"
    ></script>


    <!-- ======================================
         USERS JS
    ======================================= -->

    <script
        type="module"
        src="assets/js/users.js"
    ></script>


    <!-- ======================================
         PAGE PROTECTION
    ======================================= -->

    <script
        type="module"
        src="assets/js/page-protection.js"
    ></script>


</body>

</html>
