<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fc;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:400px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#0d6efd;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    background:#198754;
    color:#fff;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#157347;
}

p{
    text-align:center;
    margin-top:15px;
}

a{
    color:#0d6efd;
    text-decoration:none;
}
</style>

</head>
<body>

<div class="login-box">

<h2>Teacher Login</h2>

<form id="loginForm">

<input
type="text"
id="employeeCode"
placeholder="Employee Code"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

<p>
New Teacher?
<div class="register-link">
    New Teacher?
    <a href="register.html">Register Here</a>
</div>
</p>

</div>

<script type="module" src="assets/js/auth.js"></script>

</body>
</html>
