<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competition Team Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}
.login-box{
    width:380px;
    max-width:92%;
    background:#fff;
    padding:30px;
    border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
}
h2{text-align:center;margin-bottom:8px}
.subtitle{text-align:center;color:#777;margin-bottom:25px}
label{display:block;margin:14px 0 6px;font-weight:600}
input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}
button{
    width:100%;
    margin-top:22px;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#1769aa;
    color:white;
    font-size:16px;
    cursor:pointer;
}
button:hover{background:#0d568e}
#message{
    margin-top:15px;
    text-align:center;
    color:#d00;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>Competition Login</h2>
    <div class="subtitle">Team Login</div>

    <label>Team ID</label>
    <input id="loginId" type="text" placeholder="Enter Team ID">

    <label>Password</label>
    <input id="password" type="password" placeholder="Enter Password">

    <button id="loginBtn">Login</button>

    <div id="message"></div>
</div>

<script type="module" src="assets/js/competition-login.js"></script>

</body>
</html>
