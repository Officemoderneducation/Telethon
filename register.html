<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Teacher Registration | Telethon</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


body {

    min-height: 100vh;

    background: #f4f7fc;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}


/* ==================================
   REGISTRATION BOX
================================== */

.register-box {

    width: 100%;

    max-width: 500px;

    background: #ffffff;

    padding: 30px;

    border-radius: 12px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.10);
}


/* ==================================
   HEADING
================================== */

h2 {

    text-align: center;

    color: #0d6efd;

    margin-bottom: 8px;

    font-size: 28px;
}


.subtitle {

    text-align: center;

    color: #64748b;

    font-size: 14px;

    margin-bottom: 25px;
}


/* ==================================
   FORM GROUP
================================== */

.form-group {

    margin-bottom: 16px;
}


label {

    display: block;

    margin-bottom: 6px;

    color: #334155;

    font-size: 14px;

    font-weight: bold;
}


input,
select {

    width: 100%;

    padding: 12px;

    border: 1px solid #cbd5e1;

    border-radius: 6px;

    font-size: 15px;

    outline: none;

    background: #ffffff;
}


input:focus,
select:focus {

    border-color: #0d6efd;

    box-shadow:
        0 0 0 3px rgba(13,110,253,0.10);
}


/* ==================================
   REGISTER BUTTON
================================== */

.register-btn {

    width: 100%;

    padding: 13px;

    margin-top: 8px;

    background: #198754;

    color: #ffffff;

    border: none;

    border-radius: 7px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


.register-btn:hover {

    background: #157347;
}


.register-btn:disabled {

    background: #94a3b8;

    cursor: not-allowed;
}


/* ==================================
   MESSAGE
================================== */

#message {

    text-align: center;

    margin-top: 15px;

    min-height: 20px;

    font-size: 14px;

    font-weight: bold;
}


/* ==================================
   LOGIN LINK
================================== */

.login-link {

    text-align: center;

    margin-top: 20px;

    color: #64748b;

    font-size: 14px;
}


.login-link a {

    color: #0d6efd;

    text-decoration: none;

    font-weight: bold;
}


.login-link a:hover {

    text-decoration: underline;
}


/* ==================================
   MOBILE
================================== */

@media (max-width: 600px) {

    .register-box {

        padding: 25px 20px;
    }


    h2 {

        font-size: 24px;
    }

}

</style>

</head>


<body>


<!-- ==================================
     REGISTRATION BOX
================================== -->

<div class="register-box">


    <!-- Heading -->

    <h2>
        Teacher Registration
    </h2>


    <p class="subtitle">
        Telethon Management System
    </p>


    <!-- ==================================
         REGISTRATION FORM
    ================================== -->

    <form id="registerForm">


        <!-- ==================================
             REGION
        ================================== -->

        <div class="form-group">

            <label for="region">
                Region
            </label>

            <select
                id="region"
                required
            >

                <option value="">
                    Select Region
                </option>

            </select>

        </div>


        <!-- ==================================
             STATE
        ================================== -->

        <div class="form-group">

            <label for="state">
                State
            </label>

            <select
                id="state"
                required
            >

                <option value="">
                    Select State
                </option>

            </select>

        </div>


        <!-- ==================================
             CITY
        ================================== -->

        <div class="form-group">

            <label for="city">
                City
            </label>

            <select
                id="city"
                required
            >

                <option value="">
                    Select City
                </option>

            </select>

        </div>


        <!-- ==================================
             JAMIATUL MADINA
        ================================== -->

        <div class="form-group">

            <label for="jamiatulMadina">
                Jamiatul Madina
            </label>

            <input
                type="text"
                id="jamiatulMadina"
                placeholder="Enter Jamiatul Madina"
                required
            >

        </div>


        <!-- ==================================
             TEACHER NAME
        ================================== -->

        <div class="form-group">

            <label for="teacherName">
                Teacher Name
            </label>

            <input
                type="text"
                id="teacherName"
                placeholder="Enter Teacher Name"
                required
            >

        </div>


        <!-- ==================================
             EMPLOYEE CODE
        ================================== -->

        <div class="form-group">

            <label for="employeeCode">
                Employee Code
            </label>

            <input
                type="text"
                id="employeeCode"
                placeholder="Enter Employee Code"
                required
            >

        </div>


        <!-- ==================================
             MOBILE NUMBER
        ================================== -->

        <div class="form-group">

            <label for="mobileNumber">
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobileNumber"
                placeholder="Enter Mobile Number"
                maxlength="10"
                inputmode="numeric"
                required
            >

        </div>


        <!-- ==================================
             PASSWORD
        ================================== -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create 4 Digit Password"
                maxlength="4"
                inputmode="numeric"
                required
            >

        </div>


        <!-- ==================================
             CONFIRM PASSWORD
        ================================== -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm 4 Digit Password"
                maxlength="4"
                inputmode="numeric"
                required
            >

        </div>


        <!-- ==================================
             REGISTER BUTTON
        ================================== -->

        <button
            type="submit"
            id="registerBtn"
            class="register-btn"
        >

            Register

        </button>


        <!-- ==================================
             MESSAGE
        ================================== -->

        <div id="message"></div>


    </form>


    <!-- ==================================
         LOGIN LINK
    ================================== -->

    <div class="login-link">

        Already Registered?

        <a href="index.html">
            Login Here
        </a>

    </div>


</div>


<!-- ==================================
     REGISTRATION JS
================================== -->

<script
    type="module"
    src="assets/js/register.js?v=5"
></script>


</body>

</html>
