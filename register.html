<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Employee Registration | Telethon</title>


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Registration CSS -->
    <link
        rel="stylesheet"
        href="assets/css/register.css"
    >


    <style>

        /* =====================================
           PAGE LAYOUT
        ===================================== */

        body {
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }


        /* =====================================
           SIDEBAR
        ===================================== */

        .sidebar {
            width: 225px;
            min-height: 100vh;
            background: #1e293b;
            color: #ffffff;
            flex-shrink: 0;
        }


        /* Logo */

        .sidebar .logo-section {
            text-align: center;
            padding: 18px 10px 20px;
            border-bottom: 1px solid #334155;
        }


        .sidebar .logo-section img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            display: block;
            margin: 0 auto 8px;
        }


        .sidebar .logo-section h2 {
            margin: 0;
            font-size: 20px;
            color: #38bdf8;
        }


        .sidebar .logo-section p {
            margin: 7px 0 0;
            font-size: 12px;
            color: #cbd5e1;
        }


        /* Menu */

        .sidebar .menu {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
        }


        .sidebar .menu a {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 12px 20px;

            color: #cbd5e1;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }


        .sidebar .menu a i {
            width: 18px;
            text-align: center;
        }


        .sidebar .menu a:hover {
            background: #0f172a;
            color: #ffffff;
        }


        .sidebar .menu a.active {
            background: #2563eb;
            color: #ffffff;
        }


        .sidebar .menu a:last-child {
            margin-top: 15px;
            color: #ef4444;
        }


        .sidebar .menu a:last-child:hover {
            background: #0f172a;
        }


        /* =====================================
           MAIN AREA
        ===================================== */

        .register-main {
    flex: 1;
    min-width: 0;

    height: 100vh;

    padding: 20px 30px;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    overflow-y: auto;
}


.register-box {
    width: 100%;
    max-width: 650px;
    margin: 0 auto 20px auto;
}

        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 700px) {

            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
            }

            .sidebar .logo-section {
                padding: 12px;
            }

            .sidebar .logo-section img {
                width: 55px;
                height: 55px;
            }

            .sidebar .menu {
                margin-top: 0;
            }

            .sidebar .menu a {
                padding: 10px 15px;
            }

            .register-main {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <div class="sidebar">


        <!-- Logo -->

        <div class="logo-section">

            <img
                src="assets/images/logo.png"
                alt="Telethon Logo"
            >

            <h2>Telethon</h2>

            <p>Management System</p>

        </div>


        <!-- Menu -->

        <div class="menu">


            <a href="dashboard.html">

                <i class="fa-solid fa-house"></i>

                <span>Dashboard</span>

            </a>


            <a
                href="register.html"
                class="active"
            >

                <i class="fa-solid fa-user-plus"></i>

                <span>Registration Form</span>

            </a>


            <a href="users.html">

                <i class="fa-solid fa-users"></i>

                <span>Teachers List</span>

            </a>


            <a href="daily-entry.html">

                <i class="fa-solid fa-file-circle-plus"></i>

                <span>Daily Collection</span>

            </a>


            <a href="all-entry.html">

                <i class="fa-solid fa-list"></i>

                <span>All Entry</span>

            </a>


            <a href="reports.html">

                <i class="fa-solid fa-chart-column"></i>

                <span>Reports</span>

            </a>


            <a
                href="#"
                id="logoutBtn"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>Logout</span>

            </a>


        </div>

    </div>


    <!-- =====================================
         REGISTRATION MAIN
    ====================================== -->

    <div class="register-main">


        <div class="register-box">


            <div class="logo-section">

                <img
                    src="assets/images/logo.png"
                    alt="Logo"
                    class="logo"
                >

                <h2>
                    Employee Registration
                </h2>

                <p>
                    Telethon Collection Management System
                </p>

            </div>


            <form id="registerForm">


                <!-- Region -->

                <div class="input-group">

                    <label>
                        Region
                    </label>

                    <select
                        id="region"
                        required
                    >

                        <option value="">
                            Select Region
                        </option>

                    </select>

                </div>


                <!-- State -->

                <div class="input-group">

                    <label>
                        State
                    </label>

                    <select
                        id="state"
                        required
                    >

                        <option value="">
                            Select State
                        </option>

                    </select>

                </div>


                <!-- City -->

                <div class="input-group">

                    <label>
                        City
                    </label>

                    <select
                        id="city"
                        required
                    >

                        <option value="">
                            Select City
                        </option>

                    </select>

                </div>


                <!-- Jamiatul Madina -->

                <div class="input-group">

                    <label>
                        Jamiatul Madina
                    </label>

                    <input
                        type="text"
                        id="jamiatulMadina"
                        placeholder="Enter Jamiatul Madina Name"
                        required
                    >

                </div>


                <!-- Employee Code -->

                <div class="input-group">

                    <label>
                        Employee Code
                    </label>

                    <input
                        type="text"
                        id="employeeCode"
                        placeholder="Enter Employee Code"
                        required
                    >

                </div>


                <!-- Teacher Name -->

                <div class="input-group">

                    <label>
                        Teacher Name
                    </label>

                    <input
                        type="text"
                        id="teacherName"
                        placeholder="Enter Teacher Name"
                        required
                    >

                </div>


                <!-- Mobile -->

                <div class="input-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobileNumber"
                        maxlength="10"
                        placeholder="Enter Mobile Number"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label>
                        Password (4 Digits)
                    </label>

                    <input
                        type="password"
                        id="password"
                        maxlength="4"
                        inputmode="numeric"
                        pattern="[0-9]{4}"
                        placeholder="Create 4 Digit Password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="input-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        maxlength="4"
                        inputmode="numeric"
                        pattern="[0-9]{4}"
                        placeholder="Confirm Password"
                        required
                    >

                </div>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Register
                </button>


                <p id="message"></p>


            </form>


        </div>


    </div>


    <!-- =====================================
         EXISTING REGISTRATION JAVASCRIPT
         DO NOT CHANGE
    ====================================== -->

    <script
        type="module"
        src="assets/js/register.js"
    ></script>
<script
    type="module"
    src="assets/js/page-protection.js">
</script>

</body>

</html>
