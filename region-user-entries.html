<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teacher Entries | Telethon</title>


    <!-- =====================================
         MAIN CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >


    <!-- =====================================
         FONT AWESOME
    ====================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- =====================================
         ADMIN SIDEBAR CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="components/admin-sidebar.css"
    >


    <style>

        /* =====================================
           GLOBAL
        ====================================== */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html,
        body {

            width: 100%;

            min-height: 100%;

        }


        body {

            font-family: Arial, sans-serif;

            background: #f4f6f9;

            color: #222;

        }


        /* =====================================
           MAIN CONTENT

           IMPORTANT:
           Sidebar manually nahi banaya gaya.

           Existing:
           components/admin-sidebar.html

           wahi load hoga.
        ====================================== */

        .main {

            margin-left: 235px;

            width:
                calc(100% - 235px);

            min-height: 100vh;

            padding: 25px;

            overflow-x: hidden;

        }


        /* =====================================
           PAGE CONTAINER
        ====================================== */

        .page-container {

            width: 100%;

        }


        /* =====================================
           HEADER
        ====================================== */

        .page-header {

            background: #ffffff;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap: 15px;

        }


        .page-header h1 {

            font-size: 24px;

            color: #1e293b;

        }


        .page-header h1 i {

            color: #2563eb;

            margin-right: 5px;

        }


        .page-header p {

            margin-top: 5px;

            color: #777;

            font-size: 14px;

        }


        /* =====================================
           REFRESH BUTTON
        ====================================== */

        .refresh-btn {

            border: none;

            padding:
                11px
                18px;

            border-radius: 7px;

            cursor: pointer;

            background:
                #2563eb;

            color: white;

            font-size: 14px;

            font-weight: bold;

        }


        .refresh-btn:hover {

            background: #1d4ed8;

        }


        /* =====================================
           SUMMARY
        ====================================== */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 18px;

            margin-bottom: 20px;

        }


        .summary-card {

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);

        }


        .summary-card h3 {

            font-size: 14px;

            color: #777;

            margin-bottom: 10px;

        }


        .summary-card .number {

            font-size: 25px;

            font-weight: bold;

            color: #1e293b;

        }


        /* =====================================
           FILTERS
        ====================================== */

        .filters {

            background: white;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 15px;

        }


        .filter-group {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .filter-group label {

            font-size: 13px;

            font-weight: bold;

            color: #334155;

        }


        .filter-group input,
        .filter-group select {

            width: 100%;

            height: 42px;

            padding: 10px;

            border:
                1px solid
                #cbd5e1;

            border-radius: 7px;

            outline: none;

            font-size: 14px;

            background: #ffffff;

        }


        .filter-group input:focus,
        .filter-group select:focus {

            border-color:
                #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,0.10);

        }


        /* =====================================
           CLEAR BUTTON
        ====================================== */

        .clear-btn {

            border: none;

            background:
                #dc2626;

            color: white;

            padding: 10px;

            height: 42px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;

            margin-top: 0;

        }


        .clear-btn:hover {

            background:
                #b91c1c;

        }


        /* =====================================
           TABLE CONTAINER
        ====================================== */

        .table-container {

            background: white;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);

            overflow: hidden;

        }


        .table-scroll {

            width: 100%;

            overflow-x: auto;

            -webkit-overflow-scrolling:
                touch;

        }


        /* =====================================
           TABLE
        ====================================== */

        table {

            width: 100%;

            border-collapse:
                collapse;

            min-width:
                1250px;

        }


        thead {

            background:
                #1e3a8a;

            color: white;

        }


        th,
        td {

            padding: 14px;

            text-align: left;

            border-bottom:
                1px solid
                #eee;

            font-size: 14px;

            white-space:
                nowrap;

        }


        th {

            font-weight: bold;

        }


        tbody tr:hover {

            background:
                #f8fafc;

        }


        /* =====================================
           AMOUNT
        ====================================== */

        .amount {

            font-weight: bold;

            color:
                #15803d;

        }


        /* =====================================
           ACTION BUTTONS
        ====================================== */

        .action-buttons {

            display: flex;

            gap: 7px;

        }


        .edit-btn,
        .delete-btn {

            border: none;

            padding:
                8px
                11px;

            border-radius: 6px;

            cursor: pointer;

            color: white;

            font-size: 13px;

            white-space:
                nowrap;

        }


        .edit-btn {

            background:
                #2563eb;

        }


        .edit-btn:hover {

            background:
                #1d4ed8;

        }


        .delete-btn {

            background:
                #dc2626;

        }


        .delete-btn:hover {

            background:
                #b91c1c;

        }


        /* =====================================
           LOADING / NO DATA
        ====================================== */

        .loading,
        .no-data {

            text-align:
                center;

            padding:
                40px;

            color:
                #777;

        }


        /* =====================================
           MOBILE
        ====================================== */

        @media (max-width: 800px) {

            .main {

                margin-left: 190px;

                width:
                    calc(100% - 190px);

                padding: 15px;

            }

        }


        @media (max-width: 600px) {

            .main {

                margin-left: 70px;

                width:
                    calc(100% - 70px);

                padding: 10px;

            }


            .page-container {

                padding: 0;

            }


            .page-header {

                flex-direction:
                    column;

                align-items:
                    flex-start;

                padding: 16px;

            }


            .page-header h1 {

                font-size: 20px;

            }


            .refresh-btn {

                width: 100%;

            }


            .filters {

                padding: 15px;

                grid-template-columns: 1fr;

            }


            .clear-btn {

                width: 100%;

            }


            .summary-grid {

                grid-template-columns: 1fr;

            }


            .table-container {

                border-radius: 8px;

            }

        }

    </style>

</head>


<body>


<!-- =========================================
     ADMIN SIDEBAR CONTAINER

     IMPORTANT:
     Yahan sidebar manually nahi banaya gaya.

     Existing Admin Sidebar:
     components/admin-sidebar.html

     wahi load hoga.
========================================= -->

<div id="adminSidebar"></div>



<!-- =========================================
     MAIN
========================================= -->

<div class="main">


    <div class="page-container">


        <!-- =====================================
             HEADER
        ====================================== -->

        <div class="page-header">

            <div>

                <h1>

                    <i
                        class="fa-solid fa-chalkboard-user"
                    ></i>

                    Teacher Entries

                </h1>


                <p>

                    Region Users ke through ki gayi
                    Teacher Entries

                </p>

            </div>


            <button
                type="button"
                class="refresh-btn"
                id="refreshTeacherEntriesBtn"
            >

                <i
                    class="fa-solid fa-rotate"
                ></i>

                Refresh

            </button>

        </div>



        <!-- =====================================
             SUMMARY
        ====================================== -->

        <div class="summary-grid">


            <div class="summary-card">

                <h3>
                    Total Entries
                </h3>


                <div
                    class="number"
                    id="totalEntries"
                >
                    0
                </div>

            </div>



            <div class="summary-card">

                <h3>
                    Total Teachers
                </h3>


                <div
                    class="number"
                    id="totalTeachers"
                >
                    0
                </div>

            </div>



            <div class="summary-card">

                <h3>
                    Total Amount
                </h3>


                <div
                    class="number"
                    id="totalAmount"
                >
                    ₹0
                </div>

            </div>


        </div>



        <!-- =====================================
             FILTERS
        ====================================== -->

        <div class="filters">


            <!-- SEARCH -->

            <div class="filter-group">

                <label
                    for="searchInput"
                >

                    Search

                </label>


                <input
                    type="text"
                    id="searchInput"
                    placeholder="Teacher Name / Employee Code"
                    autocomplete="off"
                >

            </div>



            <!-- REGION -->

            <div class="filter-group">

                <label
                    for="regionFilter"
                >

                    Region

                </label>


                <select
                    id="regionFilter"
                >

                    <option value="">

                        All Regions

                    </option>

                </select>

            </div>



            <!-- FROM DATE -->

            <div class="filter-group">

                <label
                    for="fromDate"
                >

                    From Date

                </label>


                <input
                    type="date"
                    id="fromDate"
                >

            </div>



            <!-- TO DATE -->

            <div class="filter-group">

                <label
                    for="toDate"
                >

                    To Date

                </label>


                <input
                    type="date"
                    id="toDate"
                >

            </div>



            <!-- CLEAR -->

            <div class="filter-group">

                <label>
                    &nbsp;
                </label>


                <button
                    type="button"
                    class="clear-btn"
                    id="clearFiltersBtn"
                >

                    <i
                        class="fa-solid fa-filter-circle-xmark"
                    ></i>

                    Clear Filters

                </button>

            </div>


        </div>



        <!-- =====================================
             TABLE
        ====================================== -->

        <div class="table-container">

            <div class="table-scroll">


                <table>


                    <thead>

                        <tr>

                            <th>
                                #
                            </th>


                            <th>
                                Teacher Name
                            </th>


                            <th>
                                Employee Code
                            </th>


                            <th>
                                Region
                            </th>


                            <th>
                                State
                            </th>


                            <th>
                                City
                            </th>


                            <th>
                                Entry Date
                            </th>


                            <th>
                                Amount
                            </th>


                            <th>
                                Entry Time
                            </th>


                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="teacherEntriesTable"
                    >

                        <tr>

                            <td
                                colspan="10"
                                class="loading"
                            >

                                <i
                                    class="fa-solid fa-spinner fa-spin"
                                ></i>

                                Loading Teacher Entries...

                            </td>

                        </tr>

                    </tbody>


                </table>


            </div>

        </div>


    </div>

</div>



<!-- =========================================
     LOAD ADMIN SIDEBAR
========================================= -->

<script>

(function () {

    const sidebarContainer =
        document.getElementById(
            "adminSidebar"
        );


    if (!sidebarContainer) {

        console.error(
            "Admin Sidebar container not found."
        );

        return;

    }


    fetch(
        "components/admin-sidebar.html"
    )

        .then(function (response) {

            if (!response.ok) {

                throw new Error(
                    "Admin Sidebar could not be loaded."
                );

            }

            return response.text();

        })

        .then(function (html) {

            sidebarContainer.innerHTML =
                html;


            /* =================================
               ACTIVE PAGE
            ================================= */

            const currentPage =
                window.location.pathname
                    .split("/")
                    .pop()
                    .toLowerCase();


            const menuLinks =
                sidebarContainer.querySelectorAll(
                    "a[data-page]"
                );


            menuLinks.forEach(
                function (link) {

                    const page =
                        (
                            link.getAttribute(
                                "data-page"
                            ) || ""
                        )
                            .toLowerCase();


                    link.classList.remove(
                        "active"
                    );


                    if (
                        page === currentPage
                    ) {

                        link.classList.add(
                            "active"
                        );

                    }

                }
            );


            /* =================================
               LOGOUT
            ================================= */

            const logoutBtn =
                sidebarContainer.querySelector(
                    "#adminLogoutBtn"
                );


            if (logoutBtn) {

                logoutBtn.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();


                        localStorage.removeItem(
                            "loggedInEmpCode"
                        );


                        localStorage.removeItem(
                            "userRole"
                        );


                        localStorage.removeItem(
                            "adminLoggedIn"
                        );


                        window.location.href =
                            "index.html";

                    }
                );

            }

        })

        .catch(function (error) {

            console.error(
                "Admin Sidebar Error:",
                error
            );


            sidebarContainer.innerHTML = `

                <div style="
                    width:235px;
                    height:100vh;
                    position:fixed;
                    left:0;
                    top:0;
                    background:#0f172a;
                    color:#fff;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    text-align:center;
                    padding:20px;
                    z-index:9999;
                ">

                    <div>

                        <i
                            class="fa-solid fa-triangle-exclamation"
                            style="
                                font-size:30px;
                                margin-bottom:10px;
                            "
                        ></i>

                        <div>
                            Admin Sidebar Load Error
                        </div>

                    </div>

                </div>

            `;

        });

})();

</script>



<!-- =========================================
     TEACHER ENTRIES JS
========================================= -->

<script
    type="module"
    src="assets/js/region-user-entries.js"
></script>


</body>

</html>
