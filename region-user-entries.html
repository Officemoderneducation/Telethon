<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teacher Entries | Telethon</title>


    <!-- =====================================
         FONT AWESOME
    ====================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }


        .page-container {
            padding: 25px;
            width: 100%;
        }


        /* =====================================
           HEADER
        ====================================== */

        .page-header {

            background: #ffffff;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap: 15px;
        }


        .page-header h1 {
            font-size: 24px;
        }


        .page-header p {

            margin-top: 5px;

            color: #777;
        }


        .refresh-btn {

            border: none;

            padding:
                11px
                18px;

            border-radius: 7px;

            cursor: pointer;

            background:
                #2563eb;

            color: white;

            font-size: 14px;
        }


        .refresh-btn:hover {
            opacity: 0.9;
        }


        /* =====================================
           SUMMARY
        ====================================== */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 18px;

            margin-bottom: 20px;
        }


        .summary-card {

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);
        }


        .summary-card h3 {

            font-size: 14px;

            color: #777;

            margin-bottom: 10px;
        }


        .summary-card .number {

            font-size: 25px;

            font-weight: bold;
        }


        /* =====================================
           FILTERS
        ====================================== */

        .filters {

            background: white;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 15px;
        }


        .filter-group {

            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .filter-group label {

            font-size: 13px;

            font-weight: bold;
        }


        .filter-group input,
        .filter-group select {

            width: 100%;

            padding: 10px;

            border:
                1px solid
                #ddd;

            border-radius: 7px;

            outline: none;

            font-size: 14px;
        }


        .filter-group input:focus,
        .filter-group select:focus {

            border-color:
                #2563eb;
        }


        /* =====================================
           CLEAR
        ====================================== */

        .clear-btn {

            border: none;

            background:
                #dc2626;

            color: white;

            padding: 10px;

            border-radius: 7px;

            cursor: pointer;

            margin-top: 23px;

            font-size: 14px;
        }


        .clear-btn:hover {
            opacity: 0.9;
        }


        /* =====================================
           TABLE
        ====================================== */

        .table-container {

            background: white;

            border-radius: 12px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);

            overflow: hidden;
        }


        .table-scroll {
            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse:
                collapse;

            min-width:
                1250px;
        }


        thead {

            background:
                #1e3a8a;

            color: white;
        }


        th,
        td {

            padding: 14px;

            text-align: left;

            border-bottom:
                1px solid
                #eee;

            font-size: 14px;

            white-space:
                nowrap;
        }


        tbody tr:hover {

            background:
                #f8fafc;
        }


        .amount {

            font-weight: bold;

            color:
                #15803d;
        }


        /* =====================================
           ACTION BUTTONS
        ====================================== */

        .action-buttons {

            display: flex;

            gap: 7px;
        }


        .edit-btn,
        .delete-btn {

            border: none;

            padding:
                8px
                11px;

            border-radius: 6px;

            cursor: pointer;

            color: white;

            font-size: 13px;

            white-space:
                nowrap;
        }


        .edit-btn {

            background:
                #2563eb;
        }


        .edit-btn:hover {

            background:
                #1d4ed8;
        }


        .delete-btn {

            background:
                #dc2626;
        }


        .delete-btn:hover {

            background:
                #b91c1c;
        }


        /* =====================================
           LOADING / NO DATA
        ====================================== */

        .loading,
        .no-data {

            text-align:
                center;

            padding:
                40px;

            color:
                #777;
        }


        /* =====================================
           MOBILE
        ====================================== */

        @media (
            max-width: 600px
        ) {

            .page-container {
                padding: 12px;
            }


            .page-header {

                flex-direction:
                    column;

                align-items:
                    flex-start;
            }


            .refresh-btn {

                width:
                    100%;
            }


            .clear-btn {

                margin-top:
                    0;
            }

        }

    </style>

</head>


<body>


    <div class="page-container">


        <!-- =====================================
             HEADER
        ====================================== -->

        <div class="page-header">

            <div>

                <h1>

                    <i
                        class="fa-solid fa-chalkboard-user"
                    ></i>

                    Teacher Entries

                </h1>


                <p>

                    Region Users ke through ki gayi
                    Teacher Entries

                </p>

            </div>


            <button
                type="button"
                class="refresh-btn"
                onclick="loadTeacherEntries()"
            >

                <i
                    class="fa-solid fa-rotate"
                ></i>

                Refresh

            </button>

        </div>


        <!-- =====================================
             SUMMARY
        ====================================== -->

        <div class="summary-grid">


            <div class="summary-card">

                <h3>
                    Total Entries
                </h3>


                <div
                    class="number"
                    id="totalEntries"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <h3>
                    Total Teachers
                </h3>


                <div
                    class="number"
                    id="totalTeachers"
                >
                    0
                </div>

            </div>


            <div class="summary-card">

                <h3>
                    Total Amount
                </h3>


                <div
                    class="number"
                    id="totalAmount"
                >
                    ₹0
                </div>

            </div>


        </div>


        <!-- =====================================
             FILTERS
        ====================================== -->

        <div class="filters">


            <div class="filter-group">

                <label
                    for="searchInput"
                >
                    Search
                </label>


                <input
                    type="text"
                    id="searchInput"
                    placeholder="Teacher Name / Employee Code"
                    autocomplete="off"
                >

            </div>


            <div class="filter-group">

                <label
                    for="regionFilter"
                >
                    Region
                </label>


                <select
                    id="regionFilter"
                >

                    <option value="">
                        All Regions
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label
                    for="fromDate"
                >
                    From Date
                </label>


                <input
                    type="date"
                    id="fromDate"
                >

            </div>


            <div class="filter-group">

                <label
                    for="toDate"
                >
                    To Date
                </label>


                <input
                    type="date"
                    id="toDate"
                >

            </div>


            <div class="filter-group">

                <label>
                    &nbsp;
                </label>


                <button
                    type="button"
                    class="clear-btn"
                    onclick="clearFilters()"
                >

                    <i
                        class="fa-solid fa-filter-circle-xmark"
                    ></i>

                    Clear Filters

                </button>

            </div>


        </div>


        <!-- =====================================
             TABLE
        ====================================== -->

        <div class="table-container">

            <div class="table-scroll">


                <table>


                    <thead>

                        <tr>

                            <th>
                                #
                            </th>


                            <th>
                                Teacher Name
                            </th>


                            <th>
                                Employee Code
                            </th>


                            <th>
                                Region
                            </th>


                            <th>
                                State
                            </th>


                            <th>
                                City
                            </th>


                            <th>
                                Entry Date
                            </th>


                            <th>
                                Amount
                            </th>


                            <th>
                                Entry Time
                            </th>


                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="teacherEntriesTable"
                    >

                        <tr>

                            <td
                                colspan="10"
                                class="loading"
                            >

                                <i
                                    class="fa-solid fa-spinner fa-spin"
                                ></i>

                                Loading Teacher Entries...

                            </td>

                        </tr>

                    </tbody>


                </table>


            </div>

        </div>


    </div>


    <!-- =====================================
         JS
    ====================================== -->

    <script
        type="module"
        src="assets/js/region-user-entries.js"
    ></script>


</body>

</html>
