<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Region User Management | Telethon</title>


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Admin Sidebar CSS -->
    <link
        rel="stylesheet"
        href="components/admin-sidebar.css"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f6f9;
            color: #1e293b;
        }


        /* =========================
           MAIN
        ========================= */

        .main {

            margin-left: 235px;

            width: calc(100% - 235px);

            min-height: 100vh;

            padding: 24px;
        }


        /* =========================
           TOPBAR
        ========================= */

        .topbar {

            background: white;

            border-radius: 10px;

            padding: 20px 24px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.06);
        }


        .topbar h2 {

            font-size: 24px;

            color: #0f172a;

            margin-bottom: 5px;
        }


        .topbar p {

            color: #64748b;

            font-size: 14px;
        }


        /* =========================
           FORM CARD
        ========================= */

        .card {

            background: white;

            border-radius: 10px;

            padding: 22px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.06);
        }


        .card h3 {

            margin-bottom: 18px;

            color: #0f172a;
        }


        /* =========================
           FORM
        ========================= */

        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 16px;
        }


        .form-group {

            display: flex;

            flex-direction: column;
        }


        .form-group.full {

            grid-column: 1 / -1;
        }


        .form-group label {

            margin-bottom: 6px;

            font-size: 13px;

            font-weight: bold;

            color: #334155;
        }


        input,
        select {

            width: 100%;

            padding: 11px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            font-size: 14px;

            background: white;
        }


        input:focus,
        select:focus {

            outline: none;

            border-color: #2563eb;
        }


        /* =========================
           ACCESS BOX
        ========================= */

        .access-box {

            border: 1px solid #e2e8f0;

            border-radius: 8px;

            padding: 15px;

            background: #f8fafc;
        }


        .access-row {

            display: grid;

            grid-template-columns:
                1fr 1fr auto;

            gap: 10px;

            margin-bottom: 10px;

            align-items: end;
        }


        .access-row label {

            display: block;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 5px;

            color: #64748b;
        }


        .remove-access {

            background: #dc3545;

            color: white;

            border: none;

            padding: 10px 13px;

            border-radius: 6px;

            cursor: pointer;
        }


        .remove-access:hover {

            background: #b02a37;
        }


        .add-access {

            background: #2563eb;

            color: white;

            border: none;

            padding: 10px 15px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

            margin-top: 5px;
        }


        .add-access:hover {

            background: #1d4ed8;
        }


        /* =========================
           BUTTONS
        ========================= */

        .save-btn {

            width: 100%;

            margin-top: 18px;

            padding: 12px;

            border: none;

            border-radius: 7px;

            background: #198754;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .save-btn:hover {

            background: #157347;
        }


        .cancel-btn {

            width: 100%;

            margin-top: 10px;

            padding: 11px;

            border: none;

            border-radius: 7px;

            background: #64748b;

            color: white;

            cursor: pointer;
        }


        /* =========================
           MESSAGE
        ========================= */

        #message {

            margin-top: 15px;

            text-align: center;

            font-weight: bold;

            min-height: 20px;
        }


        /* =========================
           TABLE
        ========================= */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;
        }


        table {

            width: 100%;

            min-width: 850px;

            border-collapse: collapse;
        }


        th {

            background: #2563eb;

            color: white;

            padding: 12px;

            text-align: left;

            font-size: 13px;
        }


        td {

            padding: 12px;

            border-bottom: 1px solid #e2e8f0;

            font-size: 13px;
        }


        tbody tr:hover {

            background: #f8fafc;
        }


        /* =========================
           ACCESS BADGES
        ========================= */

        .access-badge {

            display: inline-block;

            background: #e0f2fe;

            color: #075985;

            padding: 5px 8px;

            border-radius: 5px;

            margin: 2px;

            font-size: 11px;
        }


        /* =========================
           ACTION
        ========================= */

        .edit-btn {

            background: #ffc107;

            color: #000;

            border: none;

            padding: 6px 10px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 12px;
        }


        .delete-btn {

            background: #dc3545;

            color: white;

            border: none;

            padding: 6px 10px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 12px;

            margin-left: 5px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .main {

                margin-left: 70px;

                width: calc(100% - 70px);

                padding: 12px;
            }


            .form-grid {

                grid-template-columns: 1fr;
            }


            .form-group.full {

                grid-column: auto;
            }


            .access-row {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     ADMIN SIDEBAR
========================================= -->

<div id="adminSidebar"></div>



<!-- =========================================
     MAIN
========================================= -->

<div class="main">


    <!-- =========================
         TOPBAR
    ========================= -->

    <div class="topbar">

        <h2>
            Region User Management
        </h2>

        <p>
            Create users and assign multiple Region / State access
        </p>

    </div>



    <!-- =========================
         FORM
    ========================= -->

    <div class="card">

        <h3 id="formTitle">
            Create Region User
        </h3>


        <form id="regionUserForm">


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        User Name
                    </label>

                    <input
                        type="text"
                        id="userName"
                        placeholder="Enter User Name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Employee / User Code
                    </label>

                    <input
                        type="text"
                        id="userCode"
                        placeholder="Enter User Code"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Mobile
                    </label>

                    <input
                        type="tel"
                        id="userMobile"
                        placeholder="Enter Mobile Number"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="userPassword"
                        placeholder="Enter Password"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label>
                        Region / State Access
                    </label>


                    <div
                        class="access-box"
                        id="accessContainer"
                    >

                    </div>


                    <button
                        type="button"
                        class="add-access"
                        id="addAccessBtn"
                    >

                        <i class="fa-solid fa-plus"></i>

                        Add Region / State Access

                    </button>

                </div>


            </div>


            <button
                type="submit"
                class="save-btn"
                id="saveBtn"
            >

                <i class="fa-solid fa-save"></i>

                Save Region User

            </button>


            <button
                type="button"
                class="cancel-btn"
                id="cancelBtn"
                style="display:none;"
            >

                Cancel Edit

            </button>


            <div id="message"></div>


        </form>

    </div>



    <!-- =========================
         USERS TABLE
    ========================= -->

    <div class="card">

        <h3>
            Region Users
        </h3>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>User Name</th>

                        <th>User Code</th>

                        <th>Mobile</th>

                        <th>Assigned Access</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="regionUsersTable">

                    <tr>

                        <td
                            colspan="5"
                            style="text-align:center;"
                        >

                            Loading...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


</div>



<!-- =========================================
     LOAD ADMIN SIDEBAR
========================================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        fetch(
            "components/admin-sidebar.html"
        )

            .then(
                function (response) {

                    if (!response.ok) {

                        throw new Error(
                            "Admin Sidebar not found: " +
                            response.status
                        );

                    }

                    return response.text();

                }
            )

            .then(
                function (data) {

                    const sidebar =
                        document.getElementById(
                            "adminSidebar"
                        );


                    if (!sidebar) {

                        return;

                    }


                    sidebar.innerHTML =
                        data;


                    /* =================================
                       ACTIVE PAGE
                    ================================= */

                    let currentPage =
                        window.location.pathname
                            .split("/")
                            .pop()
                            .toLowerCase();


                    if (
                        !currentPage ||
                        currentPage === ""
                    ) {

                        currentPage =
                            "dashboard.html";

                    }


                    const menuLinks =
                        sidebar.querySelectorAll(
                            ".admin-sidebar-menu a[data-page]"
                        );


                    menuLinks.forEach(
                        function (link) {

                            const page =
                                link
                                    .getAttribute(
                                        "data-page"
                                    )
                                    .toLowerCase();


                            if (
                                page ===
                                currentPage
                            ) {

                                link.classList.add(
                                    "active"
                                );

                            }

                            else {

                                link.classList.remove(
                                    "active"
                                );

                            }

                        }
                    );


                    /* =================================
                       ADMIN LOGOUT
                    ================================= */

                    const logoutBtn =
                        sidebar.querySelector(
                            "#adminLogoutBtn"
                        );


                    if (logoutBtn) {

                        logoutBtn.addEventListener(
                            "click",
                            function (e) {

                                e.preventDefault();


                                localStorage.removeItem(
                                    "loggedInEmpCode"
                                );

                                localStorage.removeItem(
                                    "userRole"
                                );

                                localStorage.removeItem(
                                    "adminLoggedIn"
                                );

                                localStorage.removeItem(
                                    "isAdmin"
                                );


                                window.location.href =
                                    "index.html";

                            }
                        );

                    }

                }
            )

            .catch(
                function (error) {

                    console.error(
                        "Admin Sidebar Error:",
                        error
                    );

                }
            );

    }
);

</script>



<!-- =========================================
     REGION USER MANAGEMENT JS
========================================= -->

<script
    type="module"
    src="assets/js/region-user-management.js"
></script>


</body>

</html>
