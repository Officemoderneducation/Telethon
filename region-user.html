<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Region User Panel | Telethon</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f4f6f9;
    color:#1e293b;
}


/* ======================================
   TOP HEADER
====================================== */

.header{

    background:#0f172a;

    color:white;

    min-height:80px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:15px 30px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.15);
}

.logo-area{

    display:flex;

    align-items:center;

    gap:12px;
}

.logo-area img{

    width:55px;

    height:55px;

    object-fit:contain;
}

.logo-text h2{

    color:#38bdf8;

    font-size:20px;

    margin-bottom:3px;
}

.logo-text p{

    color:#cbd5e1;

    font-size:12px;
}

.user-area{

    display:flex;

    align-items:center;

    gap:18px;
}

.user-name{

    font-size:14px;

    color:#e2e8f0;
}

.logout-btn{

    border:none;

    background:#dc3545;

    color:white;

    padding:9px 15px;

    border-radius:6px;

    cursor:pointer;

    font-weight:bold;

    font-size:13px;
}

.logout-btn:hover{

    background:#b02a37;
}


/* ======================================
   MAIN
====================================== */

.main{

    width:100%;

    min-height:calc(100vh - 80px);

    padding:24px;
}


/* ======================================
   TOPBAR
====================================== */

.topbar{

    background:white;

    border-radius:10px;

    padding:20px 24px;

    margin-bottom:20px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.06);
}

.topbar h2{

    font-size:24px;

    color:#0f172a;

    margin-bottom:5px;
}

.topbar p{

    color:#64748b;

    font-size:14px;
}


/* ======================================
   FILTER PANEL
====================================== */

.filter-panel{

    background:white;

    border-radius:10px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.06);
}

.filter-title{

    font-size:17px;

    font-weight:bold;

    margin-bottom:15px;

    color:#0f172a;
}

.filters{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;
}

.filter-group label{

    display:block;

    margin-bottom:6px;

    font-size:13px;

    font-weight:bold;

    color:#475569;
}

.filter-group select,
.filter-group input{

    width:100%;

    padding:10px 12px;

    border:1px solid #cbd5e1;

    border-radius:6px;

    outline:none;

    background:white;

    font-size:14px;
}

.filter-group select:focus,
.filter-group input:focus{

    border-color:#2563eb;

    box-shadow:
        0 0 0 3px rgba(37,99,235,.10);
}

.filter-buttons{

    display:flex;

    gap:10px;

    margin-top:15px;
}

.filter-btn{

    border:none;

    padding:10px 18px;

    border-radius:6px;

    cursor:pointer;

    font-weight:bold;

    font-size:13px;
}

.apply-btn{

    background:#2563eb;

    color:white;
}

.apply-btn:hover{

    background:#1d4ed8;
}

.reset-btn{

    background:#e2e8f0;

    color:#334155;
}

.reset-btn:hover{

    background:#cbd5e1;
}


/* ======================================
   TABLE
====================================== */

.table-container{

    background:white;

    border-radius:10px;

    padding:20px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.06);
}

.table-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;
}

.table-header h3{

    font-size:18px;

    color:#0f172a;
}

.result-count{

    font-size:13px;

    color:#64748b;
}

.table-wrapper{

    width:100%;

    overflow-x:auto;

    border:1px solid #e2e8f0;

    border-radius:7px;
}

table{

    width:100%;

    min-width:1000px;

    border-collapse:collapse;

    background:white;
}

th{

    background:#2563eb;

    color:white;

    padding:13px 14px;

    text-align:left;

    font-size:13px;

    white-space:nowrap;
}

td{

    padding:13px 14px;

    border-bottom:1px solid #e2e8f0;

    font-size:14px;

    color:#334155;

    white-space:nowrap;
}

tbody tr:hover{

    background:#f8fafc;
}

.employee-code{

    font-weight:bold;

    color:#1d4ed8;
}


/* ======================================
   STATUS
====================================== */

.status-badge{

    display:inline-block;

    padding:5px 11px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;
}

.approved{

    background:#d1e7dd;

    color:#0f5132;
}

.pending{

    background:#fff3cd;

    color:#664d03;
}


/* ======================================
   LOADING / ERROR
====================================== */

.loading-cell,
.empty-cell,
.error-cell{

    text-align:center;

    padding:30px !important;
}

.loading-cell{

    color:#64748b;
}

.empty-cell{

    color:#64748b;
}

.error-cell{

    color:#dc3545;
}


/* ======================================
   MOBILE
====================================== */

@media(max-width:900px){

    .filters{

        grid-template-columns:
            repeat(2,1fr);
    }
}

@media(max-width:600px){

    .header{

        padding:12px 15px;
    }

    .logo-area img{

        width:45px;

        height:45px;
    }

    .logo-text h2{

        font-size:17px;
    }

    .logo-text p{

        font-size:11px;
    }

    .user-area{

        gap:8px;
    }

    .user-name{

        display:none;
    }

    .main{

        padding:12px;
    }

    .filters{

        grid-template-columns:1fr;
    }

    .filter-panel,
    .table-container{

        padding:12px;
    }

    .topbar h2{

        font-size:20px;
    }

}

</style>

</head>


<body>


<!-- ======================================
     HEADER
====================================== -->

<header class="header">

    <div class="logo-area">

        <img
            src="assets/images/logo.png"
            alt="Telethon Logo"
        >

        <div class="logo-text">

            <h2>
                Telethon
            </h2>

            <p>
                Region User Panel
            </p>

        </div>

    </div>


    <div class="user-area">

        <span
            id="loggedUserName"
            class="user-name"
        >
            Region User
        </span>


        <button
            type="button"
            id="logoutBtn"
            class="logout-btn"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </div>

</header>


<!-- ======================================
     MAIN
====================================== -->

<div class="main">


    <!-- TOPBAR -->

    <div class="topbar">

        <h2>
            Collection Summary
        </h2>

        <p>
            Aapko sirf assigned Region / State ka data dikhaya ja raha hai.
        </p>

    </div>


    <!-- ==================================
         FILTER PANEL
    ================================== -->

    <div class="filter-panel">

        <div class="filter-title">

            <i class="fa-solid fa-filter"></i>

            Filter Teachers

        </div>


        <div class="filters">


            <!-- Region -->

            <div class="filter-group">

                <label for="regionFilter">
                    Region
                </label>

                <select id="regionFilter">

                    <option value="">
                        All Regions
                    </option>

                </select>

            </div>


            <!-- State -->

            <div class="filter-group">

                <label for="stateFilter">
                    State
                </label>

                <select id="stateFilter">

                    <option value="">
                        All States
                    </option>

                </select>

            </div>


            <!-- City -->

            <div class="filter-group">

                <label for="cityFilter">
                    City
                </label>

                <select id="cityFilter">

                    <option value="">
                        All Cities
                    </option>

                </select>

            </div>


            <!-- Status -->

            <div class="filter-group">

                <label for="statusFilter">
                    Status
                </label>

                <select id="statusFilter">

                    <option value="">
                        All Status
                    </option>

                    <option value="Approved">
                        Approved
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                </select>

            </div>


            <!-- Search -->

            <div class="filter-group">

                <label for="searchFilter">
                    Search
                </label>

                <input
                    type="text"
                    id="searchFilter"
                    placeholder="Teacher / Employee Code / Mobile"
                    autocomplete="off"
                >

            </div>

        </div>


        <div class="filter-buttons">

            <button
                type="button"
                id="applyFilter"
                class="filter-btn apply-btn"
            >

                <i class="fa-solid fa-filter"></i>

                Apply Filter

            </button>


            <button
                type="button"
                id="resetFilter"
                class="filter-btn reset-btn"
            >

                <i class="fa-solid fa-rotate-left"></i>

                Reset

            </button>

        </div>

    </div>


    <!-- ==================================
         TABLE
    ================================== -->

    <div class="table-container">


        <div class="table-header">

            <h3>
                Teachers Data
            </h3>

            <span
                id="resultCount"
                class="result-count"
            >
                Loading...
            </span>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Employee Code
                        </th>

                        <th>
                            Teacher Name
                        </th>

                        <th>
                            Mobile
                        </th>

                        <th>
                            Region
                        </th>

                        <th>
                            State
                        </th>

                        <th>
                            City
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="regionUsersTable">

                    <tr>

                        <td
                            colspan="7"
                            class="loading-cell"
                        >
                            Loading Teachers...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- ======================================
     FIREBASE
====================================== -->

<script
    type="module"
    src="assets/js/firebase-config.js"
></script>


<!-- ======================================
     REGION USER JS
====================================== -->

<script
    type="module"
    src="assets/js/region-user.js"
></script>


</body>

</html>
