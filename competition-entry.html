<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Telethon - Competition Entry
    </title>


    <!-- ==================================================
         FONT AWESOME
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==================================================
         GOOGLE FONT
    ================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                "Inter",
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f4f6f9;

            color:
                #111827;

        }


        /* ==================================================
           HEADER
        ================================================== */

        .page-header {

            background:
                #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                18px 25px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            position:
                sticky;

            top:
                0;

            z-index:
                100;

        }


        .page-title {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

        }


        .page-title-icon {

            width:
                44px;

            height:
                44px;

            border-radius:
                11px;

            background:
                #eef2ff;

            color:
                #4f46e5;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                20px;

        }


        .page-title h1 {

            font-size:
                22px;

            margin-bottom:
                4px;

        }


        .page-title p {

            font-size:
                13px;

            color:
                #6b7280;

        }


        .header-actions {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

        }


        .header-btn {

            border:
                1px solid #e5e7eb;

            background:
                #ffffff;

            color:
                #374151;

            padding:
                10px 14px;

            border-radius:
                8px;

            text-decoration:
                none;

            cursor:
                pointer;

            font-size:
                14px;

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

        }


        .logout-btn {

            color:
                #dc2626;

        }


        /* ==================================================
           MAIN
        ================================================== */

        .main-container {

            max-width:
                1200px;

            margin:
                30px auto;

            padding:
                0 20px 60px;

        }


        /* ==================================================
           FORM CARD
        ================================================== */

        .form-card {

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                16px;

            padding:
                28px;

            box-shadow:
                0 8px 25px
                rgba(
                    0,
                    0,
                    0,
                    0.04
                );

        }


        /* ==================================================
           SECTION TITLE
        ================================================== */

        .section-title {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            font-size:
                19px;

            font-weight:
                700;

            margin:
                0 0 18px;

            padding-bottom:
                12px;

            border-bottom:
                1px solid #e5e7eb;

        }


        .section-title i {

            color:
                #4f46e5;

        }


        /* ==================================================
           FORM GRID
        ================================================== */

        .form-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap:
                18px;

            margin-bottom:
                30px;

        }


        .form-group {

            display:
                flex;

            flex-direction:
                column;

            gap:
                7px;

        }


        .form-group label {

            font-size:
                13px;

            font-weight:
                600;

            color:
                #374151;

        }


        input,
        select {

            width:
                100%;

            height:
                44px;

            border:
                1px solid #d1d5db;

            border-radius:
                8px;

            padding:
                0 12px;

            font-size:
                14px;

            outline:
                none;

            background:
                #ffffff;

        }


        input:focus,
        select:focus {

            border-color:
                #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(
                    99,
                    102,
                    241,
                    0.10
                );

        }


        /* ==================================================
           COMPETITION WRAPPER
        ================================================== */

        .competition-wrapper {

            display:
                grid;

            grid-template-columns:
                minmax(
                    0,
                    1fr
                )
                80px
                minmax(
                    0,
                    1fr
                );

            gap:
                20px;

            align-items:
                center;

        }


        /* ==================================================
           PARTICIPANT CARD
        ================================================== */

        .side-card {

            border:
                1px solid #e5e7eb;

            border-radius:
                14px;

            overflow:
                hidden;

            background:
                #ffffff;

        }


        .side-body {

            padding:
                18px;

        }


        /* ==================================================
           NAME INPUT
           NO LABEL
        ================================================== */

        .participant-name {

            width:
                100%;

            height:
                50px;

            margin-bottom:
                18px;

            font-size:
                16px;

            font-weight:
                700;

            text-align:
                center;

            border:
                2px solid #c7d2fe;

            background:
                #f8faff;

        }


        /* ==================================================
           REGION / STATE ROW
        ================================================== */

        .competition-side-row {

            display:
                grid;

            grid-template-columns:
                1fr
                1fr
                42px;

            gap:
                10px;

            align-items:
                end;

            padding:
                12px;

            margin-bottom:
                12px;

            background:
                #f9fafb;

            border:
                1px solid #e5e7eb;

            border-radius:
                10px;

        }


        .competition-field {

            display:
                flex;

            flex-direction:
                column;

            gap:
                6px;

        }


        .competition-field label {

            font-size:
                11px;

            font-weight:
                700;

            color:
                #6b7280;

        }


        .remove-side-row {

            width:
                40px;

            height:
                40px;

            border:
                none;

            border-radius:
                8px;

            background:
                #fee2e2;

            color:
                #dc2626;

            cursor:
                pointer;

        }


        .add-row-btn {

            width:
                100%;

            margin-top:
                5px;

            border:
                none;

            background:
                #eef2ff;

            color:
                #4f46e5;

            padding:
                11px;

            border-radius:
                8px;

            font-weight:
                700;

            cursor:
                pointer;

        }


        /* ==================================================
           VS
        ================================================== */

        .vs-container {

            display:
                flex;

            justify-content:
                center;

        }


        .vs-circle {

            width:
                64px;

            height:
                64px;

            border-radius:
                50%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                #111827;

            color:
                #ffffff;

            font-weight:
                800;

        }


        /* ==================================================
           ACTIONS
        ================================================== */

        .form-actions {

            display:
                flex;

            justify-content:
                flex-end;

            gap:
                10px;

            margin-top:
                25px;

            padding-top:
                20px;

            border-top:
                1px solid #e5e7eb;

        }


        .btn {

            height:
                44px;

            padding:
                0 18px;

            border:
                none;

            border-radius:
                8px;

            cursor:
                pointer;

            font-weight:
                700;

            display:
                inline-flex;

            align-items:
                center;

            gap:
                8px;

        }


        .btn-secondary {

            background:
                #f3f4f6;

            color:
                #374151;

        }


        .btn-primary {

            background:
                #4f46e5;

            color:
                #ffffff;

        }


        /* ==================================================
           MESSAGE
        ================================================== */

        .competition-message {

            display:
                none;

            margin-top:
                20px;

            padding:
                13px;

            border-radius:
                8px;

            font-size:
                14px;

            font-weight:
                600;

        }


        .competition-message.success {

            display:
                block;

            background:
                #dcfce7;

            color:
                #166534;

        }


        .competition-message.error {

            display:
                block;

            background:
                #fee2e2;

            color:
                #991b1b;

        }


        /* ==================================================
           SAVED COMPETITIONS
        ================================================== */

        .saved-section {

            margin-top:
                35px;

        }


        .competition-list {

            display:
                grid;

            gap:
                15px;

        }


        .saved-competition {

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                12px;

            padding:
                18px;

        }


        .saved-top {

            display:
                flex;

            justify-content:
                space-between;

            gap:
                15px;

            align-items:
                center;

        }


        .saved-name {

            font-size:
                17px;

            font-weight:
                800;

        }


        .saved-meta {

            margin-top:
                5px;

            color:
                #6b7280;

            font-size:
                13px;

        }


        .saved-actions {

            display:
                flex;

            gap:
                8px;

            flex-wrap:
                wrap;

        }


        .small-btn {

            border:
                none;

            padding:
                9px 12px;

            border-radius:
                7px;

            cursor:
                pointer;

            font-size:
                13px;

            font-weight:
                600;

        }


        .edit-btn {

            background:
                #eef2ff;

            color:
                #4f46e5;

        }


        .delete-btn {

            background:
                #fee2e2;

            color:
                #dc2626;

        }


        .copy-btn {

            background:
                #ecfdf5;

            color:
                #047857;

        }


        @media (max-width: 900px) {

            .form-grid {

                grid-template-columns:
                    1fr;

            }


            .competition-wrapper {

                grid-template-columns:
                    1fr;

            }


            .vs-container {

                padding:
                    5px;

            }

        }


        @media (max-width: 600px) {

            .page-header {

                padding:
                    14px;

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .header-actions {

                justify-content:
                    space-between;

            }


            .main-container {

                padding:
                    0 12px 40px;

            }


            .form-card {

                padding:
                    16px;

            }


            .competition-side-row {

                grid-template-columns:
                    1fr;

            }


            .remove-side-row {

                width:
                    100%;

            }


            .form-actions {

                flex-direction:
                    column;

            }


            .btn {

                justify-content:
                    center;

            }


            .saved-top {

                flex-direction:
                    column;

                align-items:
                    flex-start;

            }

        }

    </style>

</head>


<body>


<header class="page-header">

    <div class="page-title">

        <div class="page-title-icon">

            <i class="fa-solid fa-trophy"></i>

        </div>


        <div>

            <h1>
                Competition Entry
            </h1>

            <p>
                Create and Manage Competition
            </p>

        </div>

    </div>


    <div class="header-actions">

        <a
            href="dashboard.html"
            class="header-btn"
        >

            <i class="fa-solid fa-house"></i>

            Dashboard

        </a>


        <button
            type="button"
            class="header-btn logout-btn"
            id="logoutBtn"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </div>

</header>



<main class="main-container">


    <div class="form-card">


        <form
            id="competitionForm"
            autocomplete="off"
        >


            <div class="section-title">

                <i class="fa-solid fa-pen-to-square"></i>

                Competition Details

            </div>


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Competition Name
                    </label>

                    <input
                        type="text"
                        id="competitionName"
                        placeholder="Competition Name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Competition Date
                    </label>

                    <input
                        type="date"
                        id="competitionDate"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Competition End Time
                    </label>

                    <input
                        type="time"
                        id="competitionEndTime"
                        required
                    >

                </div>


            </div>



            <div class="section-title">

                <i class="fa-solid fa-users"></i>

                Competition Participants

            </div>



            <div class="competition-wrapper">


                <!-- ============================
                     FIRST PARTICIPANT
                ============================= -->

                <div class="side-card">

                    <div class="side-body">


                        <!-- NO LABEL -->

                        <input
                            type="text"
                            id="participantAName"
                            class="participant-name"
                            placeholder="Enter Name"
                            required
                        >


                        <div
                            id="sideAContainer"
                        ></div>


                        <button
                            type="button"
                            class="add-row-btn"
                            id="addSideARow"
                        >

                            <i class="fa-solid fa-plus"></i>

                            Add Region / State

                        </button>


                    </div>

                </div>



                <!-- VS -->

                <div class="vs-container">

                    <div class="vs-circle">
                        VS
                    </div>

                </div>



                <!-- ============================
                     SECOND PARTICIPANT
                ============================= -->

                <div class="side-card">

                    <div class="side-body">


                        <!-- NO LABEL -->

                        <input
                            type="text"
                            id="participantBName"
                            class="participant-name"
                            placeholder="Enter Name"
                            required
                        >


                        <div
                            id="sideBContainer"
                        ></div>


                        <button
                            type="button"
                            class="add-row-btn"
                            id="addSideBRow"
                        >

                            <i class="fa-solid fa-plus"></i>

                            Add Region / State

                        </button>


                    </div>

                </div>


            </div>



            <div
                id="competitionMessage"
                class="competition-message"
            ></div>



            <div class="form-actions">


                <button
                    type="button"
                    class="btn btn-secondary"
                    id="resetCompetitionBtn"
                >

                    <i class="fa-solid fa-rotate-left"></i>

                    Reset

                </button>


                <button
                    type="submit"
                    class="btn btn-primary"
                    id="saveCompetitionBtn"
                >

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Competition

                </button>


            </div>


        </form>

    </div>



    <!-- ==================================================
         SAVED COMPETITIONS
    ================================================== -->

    <section class="saved-section">


        <div class="section-title">

            <i class="fa-solid fa-list"></i>

            Saved Competitions

        </div>


        <div
            id="competitionList"
            class="competition-list"
        ></div>


    </section>


</main>



<script
    type="module"
    src="assets/js/competition-entry.js"
></script>


</body>

</html>
