<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const sidebarContainer =
            document.getElementById(
                "teacherSidebar"
            );

        if (!sidebarContainer) {
            return;
        }


        /* ======================================
           LOAD TEACHER SIDEBAR
        ====================================== */

        fetch(
            "components/teacher-sidebar.html"
        )

        .then(function (response) {

            if (!response.ok) {

                throw new Error(
                    "Teacher Sidebar not found. Status: " +
                    response.status
                );

            }

            return response.text();

        })

        .then(function (data) {

            sidebarContainer.innerHTML =
                data;


            /* ==================================
               IMPORTANT:
               REMOVE ADMIN DASHBOARD
            ================================== */

            const dashboardLinks =
                sidebarContainer.querySelectorAll(
                    'a[href="dashboard.html"],' +
                    'a[data-page="dashboard.html"],' +
                    '.teacher-menu-link[data-page="dashboard.html"]'
                );


            dashboardLinks.forEach(
                function (link) {

                    link.remove();

                }
            );


            /* ==================================
               CURRENT PAGE
            ================================== */

            let currentPage =
                window.location.pathname
                    .split("/")
                    .pop()
                    .toLowerCase();


            if (!currentPage) {

                currentPage =
                    "summary.html";

            }


            /* ==================================
               ACTIVE MENU
            ================================== */

            const menuLinks =
                sidebarContainer.querySelectorAll(
                    ".teacher-menu-link[data-page]"
                );


            menuLinks.forEach(
                function (link) {

                    const page =
                        (
                            link.getAttribute(
                                "data-page"
                            ) || ""
                        )
                        .trim()
                        .toLowerCase();


                    if (
                        page === currentPage
                    ) {

                        link.classList.add(
                            "active"
                        );

                    }
                    else {

                        link.classList.remove(
                            "active"
                        );

                    }

                }
            );


            /* ==================================
               TEACHER USER NAME
            ================================== */

            const savedUserName =
                localStorage.getItem(
                    "teacherUserName"
                ) ||
                localStorage.getItem(
                    "regionUserName"
                );


            const sidebarUserName =
                sidebarContainer.querySelector(
                    "#teacherSidebarUserName"
                );


            const topUserName =
                document.getElementById(
                    "topUserName"
                );


            if (savedUserName) {

                if (sidebarUserName) {

                    sidebarUserName.textContent =
                        savedUserName;

                }


                if (topUserName) {

                    topUserName.textContent =
                        savedUserName;

                }

            }


            /* ==================================
               MOBILE MENU
            ================================== */

            const mobileMenuBtn =
                document.getElementById(
                    "mobileMenuBtn"
                );


            const sidebar =
                sidebarContainer.querySelector(
                    ".teacher-sidebar"
                );


            if (
                mobileMenuBtn &&
                sidebar
            ) {

                mobileMenuBtn.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();

                        event.stopPropagation();

                        sidebar.classList.toggle(
                            "open"
                        );

                    }
                );


                /* ==============================
                   CLOSE MOBILE SIDEBAR
                ============================== */

                sidebar
                    .querySelectorAll(
                        ".teacher-menu-link"
                    )
                    .forEach(
                        function (link) {

                            link.addEventListener(
                                "click",
                                function () {

                                    if (
                                        window.innerWidth <=
                                        800
                                    ) {

                                        sidebar.classList.remove(
                                            "open"
                                        );

                                    }

                                }
                            );

                        }
                    );

            }


            /* ==================================
               LOGOUT
            ================================== */

            const logoutBtn =
                sidebarContainer.querySelector(
                    "#teacherSidebarLogout"
                );


            if (logoutBtn) {

                logoutBtn.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();


                        localStorage.removeItem(
                            "loggedInEmpCode"
                        );

                        localStorage.removeItem(
                            "userRole"
                        );

                        localStorage.removeItem(
                            "teacherUserName"
                        );


                        window.location.href =
                            "index.html";

                    }
                );

            }

        })

        .catch(function (error) {

            console.error(
                "Teacher Sidebar Error:",
                error
            );


            sidebarContainer.innerHTML = `

                <div
                    style="
                        padding:20px;
                        color:#dc2626;
                        background:#fee2e2;
                        border-radius:8px;
                    "
                >

                    Teacher Sidebar load nahi hua.

                    <br><br>

                    ${error.message}

                </div>

            `;

        });

    }

);

</script>
