<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Telethon - Academic Department Competition
    </title>


    <!-- ==================================================
         FONT AWESOME
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==================================================
         GOOGLE FONT
    ================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================================
         STYLE
    ================================================== -->

    <style>

        /* ==================================================
           RESET
        ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==================================================
           BODY
        ================================================== */

        body {

            font-family:
                "Inter",
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f4f6f9;

            color:
                #111827;

            min-height:
                100vh;
        }


        /* ==================================================
           HEADER
        ================================================== */

        .competition-header {

            width:
                100%;

            background:
                #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                16px 25px;
        }


        .header-inner {

            width:
                100%;

            max-width:
                1180px;

            margin:
                0 auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;
        }


        /* ==================================================
           BRAND
        ================================================== */

        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                11px;
        }


        .brand-icon {

            width:
                44px;

            height:
                44px;

            border-radius:
                12px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                #eef2ff;

            color:
                #4f46e5;

            font-size:
                19px;
        }


        .brand-name {

            font-size:
                21px;

            font-weight:
                800;

            color:
                #111827;
        }


        .brand-subtitle {

            margin-top:
                3px;

            color:
                #6b7280;

            font-size:
                11px;

            font-weight:
                500;
        }


        /* ==================================================
           PUBLIC BADGE
        ================================================== */

        .public-badge {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            padding:
                8px 13px;

            border:
                1px solid #a7f3d0;

            border-radius:
                999px;

            background:
                #ecfdf5;

            color:
                #047857;

            font-size:
                12px;

            font-weight:
                700;
        }


        .public-badge i {

            font-size:
                11px;
        }


        /* ==================================================
           MAIN
        ================================================== */

        .main-container {

            width:
                100%;

            max-width:
                1050px;

            margin:
                0 auto;

            padding:
                50px 20px 70px;
        }


        /* ==================================================
           PAGE HEADING
        ================================================== */

        .page-heading {

            text-align:
                center;

            margin-bottom:
                35px;
        }


        .page-heading-icon {

            width:
                58px;

            height:
                58px;

            margin:
                0 auto 15px;

            border-radius:
                17px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                #eef2ff;

            color:
                #4f46e5;

            font-size:
                24px;

            box-shadow:
                0 8px 22px
                rgba(
                    79,
                    70,
                    229,
                    0.10
                );
        }


        .page-heading h1 {

            font-size:
                30px;

            line-height:
                1.3;

            font-weight:
                800;

            color:
                #111827;

            margin-bottom:
                9px;
        }


        /* ==================================================
           COMPETITION LIST
        ================================================== */

        #competitionList {

            display:
                flex;

            flex-direction:
                column;

            gap:
                25px;
        }


        /* ==================================================
           COMPETITION CARD
        ================================================== */

        .competition-card {

            position:
                relative;

            width:
                100%;

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                24px;

            padding:
                40px;

            box-shadow:
                0 15px 40px
                rgba(
                    17,
                    24,
                    39,
                    0.07
                );

            overflow:
                hidden;
        }


        .competition-card::before {

            content:
                "";

            position:
                absolute;

            top:
                0;

            left:
                0;

            right:
                0;

            height:
                4px;

            background:
                #4f46e5;
        }


        /* ==================================================
           COMPETITION NAME
        ================================================== */

        .competition-name {

            text-align:
                center;

            font-size:
                31px;

            line-height:
                1.35;

            font-weight:
                800;

            color:
                #111827;

            word-break:
                break-word;

            margin-bottom:
                18px;
        }


        /* ==================================================
           DATE + END TIME
        ================================================== */

        .competition-meta {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            flex-wrap:
                wrap;

            gap:
                10px;

            margin-bottom:
                35px;
        }


        .meta-item {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            padding:
                9px 14px;

            border:
                1px solid #e5e7eb;

            border-radius:
                999px;

            background:
                #f9fafb;

            color:
                #4b5563;

            font-size:
                13px;

            font-weight:
                600;
        }


        .meta-item i {

            color:
                #4f46e5;
        }


        .meta-end {

            color:
                #111827;

            background:
                #fefce8;

            border-color:
                #fde68a;
        }


        .meta-end i {

            color:
                #ca8a04;
        }


        /* ==================================================
           TEAMS AREA
        ================================================== */

        .teams-wrapper {

            display:
                grid;

            grid-template-columns:
                minmax(
                    0,
                    1fr
                )
                85px
                minmax(
                    0,
                    1fr
                );

            align-items:
                center;

            gap:
                22px;
        }


        /* ==================================================
           TEAM CARD
        ================================================== */

        .team-card {

            min-height:
                205px;

            padding:
                28px 24px;

            border:
                1px solid #e5e7eb;

            border-radius:
                19px;

            background:
                #f9fafb;

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .team-card:hover {

            transform:
                translateY(
                    -2px
                );

            box-shadow:
                0 10px 25px
                rgba(
                    17,
                    24,
                    39,
                    0.07
                );
        }


        /* ==================================================
           TEAM ICON
        ================================================== */

        .team-icon {

            width:
                52px;

            height:
                52px;

            border-radius:
                15px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            margin-bottom:
                15px;

            font-size:
                20px;
        }


        .team-left .team-icon {

            background:
                #eff6ff;

            color:
                #2563eb;
        }


        .team-right .team-icon {

            background:
                #fef2f2;

            color:
                #dc2626;
        }


        /* ==================================================
           TEAM NAME
        ================================================== */

        .team-name {

            width:
                100%;

            font-size:
                21px;

            line-height:
                1.4;

            font-weight:
                800;

            color:
                #111827;

            word-break:
                break-word;

            margin-bottom:
                18px;
        }


        /* ==================================================
           UNIT LABEL
        ================================================== */

        .unit-label {

            font-size:
                11px;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

            color:
                #6b7280;

            font-weight:
                700;

            margin-bottom:
                4px;
        }


        /* ==================================================
           UNIT VALUE
        ================================================== */

        .unit-value {

            font-size:
                29px;

            line-height:
                1.2;

            font-weight:
                800;

            color:
                #111827;
        }


        .unit-text {

            font-size:
                14px;

            font-weight:
                700;

            color:
                #6b7280;

            margin-left:
                3px;
        }


        /* ==================================================
           VS AREA
        ================================================== */

        .vs-area {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;
        }


        .vs-circle {

            width:
                68px;

            height:
                68px;

            border-radius:
                50%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                #111827;

            color:
                #ffffff;

            font-size:
                18px;

            font-weight:
                800;

            box-shadow:
                0 8px 20px
                rgba(
                    17,
                    24,
                    39,
                    0.18
                );
        }


        /* ==================================================
           LOADING
        ================================================== */

        .loading-box {

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                20px;

            padding:
                60px 20px;

            text-align:
                center;

            color:
                #6b7280;

            box-shadow:
                0 10px 30px
                rgba(
                    17,
                    24,
                    39,
                    0.05
                );
        }


        .loading-box i {

            display:
                block;

            font-size:
                30px;

            margin-bottom:
                13px;

            color:
                #4f46e5;

            animation:
                spin 1s linear infinite;
        }


        @keyframes spin {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* ==================================================
           EMPTY
        ================================================== */

        .empty-box {

            display:
                none;

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                20px;

            padding:
                65px 20px;

            text-align:
                center;

            box-shadow:
                0 10px 30px
                rgba(
                    17,
                    24,
                    39,
                    0.05
                );
        }


        .empty-box i {

            display:
                block;

            font-size:
                48px;

            color:
                #9ca3af;

            margin-bottom:
                16px;
        }


        .empty-box h3 {

            font-size:
                20px;

            margin-bottom:
                8px;

            color:
                #111827;
        }


        .empty-box p {

            color:
                #6b7280;

            font-size:
                14px;
        }


        /* ==================================================
           ERROR
        ================================================== */

        .error-box {

            display:
                none;

            background:
                #ffffff;

            border:
                1px solid #fecaca;

            border-radius:
                20px;

            padding:
                50px 20px;

            text-align:
                center;

            color:
                #991b1b;
        }


        .error-box i {

            display:
                block;

            font-size:
                38px;

            margin-bottom:
                14px;
        }


        .error-box h3 {

            font-size:
                19px;

            margin-bottom:
                8px;
        }


        .error-box p {

            font-size:
                14px;
        }


        /* ==================================================
           FOOTER
        ================================================== */

        .page-footer {

            text-align:
                center;

            margin-top:
                30px;

            color:
                #9ca3af;

            font-size:
                12px;
        }


        /* ==================================================
           TABLET
        ================================================== */

        @media (
            max-width: 800px
        ) {

            .main-container {

                padding:
                    40px 15px 55px;
            }


            .competition-card {

                padding:
                    32px 25px;
            }


            .competition-name {

                font-size:
                    27px;
            }


            .teams-wrapper {

                grid-template-columns:
                    1fr;

                gap:
                    15px;
            }


            .team-card {

                min-height:
                    175px;
            }


            .vs-area {

                padding:
                    2px 0;
            }


            .vs-circle {

                width:
                    55px;

                height:
                    55px;

                font-size:
                    16px;
            }

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (
            max-width: 600px
        ) {

            .competition-header {

                padding:
                    13px 14px;
            }


            .header-inner {

                gap:
                    10px;
            }


            .brand {

                gap:
                    9px;
            }


            .brand-icon {

                width:
                    39px;

                height:
                    39px;

                border-radius:
                    10px;

                font-size:
                    17px;
            }


            .brand-name {

                font-size:
                    18px;
            }


            .brand-subtitle {

                font-size:
                    9px;
            }


            .public-badge {

                padding:
                    7px 9px;

                font-size:
                    10px;
            }


            .main-container {

                padding:
                    30px 12px 45px;
            }


            .page-heading {

                margin-bottom:
                    25px;
            }


            .page-heading-icon {

                width:
                    50px;

                height:
                    50px;

                border-radius:
                    14px;

                font-size:
                    21px;

                margin-bottom:
                    12px;
            }


            .page-heading h1 {

                font-size:
                    23px;
            }


            .competition-card {

                padding:
                    28px 15px;

                border-radius:
                    18px;
            }


            .competition-name {

                font-size:
                    23px;

                margin-bottom:
                    15px;
            }


            .competition-meta {

                flex-direction:
                    column;

                gap:
                    8px;

                margin-bottom:
                    27px;
            }


            .meta-item {

                font-size:
                    12px;

                padding:
                    8px 12px;
            }


            .team-card {

                min-height:
                    165px;

                padding:
                    24px 15px;

                border-radius:
                    15px;
            }


            .team-icon {

                width:
                    45px;

                height:
                    45px;

                border-radius:
                    13px;

                margin-bottom:
                    12px;

                font-size:
                    17px;
            }


            .team-name {

                font-size:
                    18px;

                margin-bottom:
                    15px;
            }


            .unit-label {

                font-size:
                    10px;
            }


            .unit-value {

                font-size:
                    25px;
            }


            .unit-text {

                font-size:
                    13px;
            }


            .vs-circle {

                width:
                    48px;

                height:
                    48px;

                font-size:
                    14px;
            }

        }


        /* ==================================================
           SMALL MOBILE
        ================================================== */

        @media (
            max-width: 380px
        ) {

            .brand-subtitle {

                display:
                    none;
            }


            .public-badge {

                padding:
                    6px 8px;
            }


            .page-heading h1 {

                font-size:
                    21px;
            }


            .competition-name {

                font-size:
                    21px;
            }


            .team-name {

                font-size:
                    17px;
            }


            .unit-value {

                font-size:
                    23px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="competition-header">

        <div class="header-inner">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">

                    <i class="fa-solid fa-trophy"></i>

                </div>


                <div>

                    <div class="brand-name">
                        Telethon
                    </div>

                    <div class="brand-subtitle">
                        Public Competition
                    </div>

                </div>

            </div>


            <!-- PUBLIC -->

            <div class="public-badge">

                <i class="fa-solid fa-globe"></i>

                Public

            </div>

        </div>

    </header>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="main-container">


        <!-- ==================================================
             PAGE TITLE
        ================================================== -->

        <div class="page-heading">

            <div class="page-heading-icon">

                <i class="fa-solid fa-trophy"></i>

            </div>


            <h1>
                Academic Department Competition
            </h1>

        </div>



        <!-- ==================================================
             LOADING
        ================================================== -->

        <div
            id="loadingBox"
            class="loading-box"
        >

            <i class="fa-solid fa-spinner"></i>

            <p>
                Loading Competition...
            </p>

        </div>



        <!-- ==================================================
             ERROR
        ================================================== -->

        <div
            id="errorBox"
            class="error-box"
        >

            <i class="fa-solid fa-triangle-exclamation"></i>

            <h3>
                Competition Load Error
            </h3>

            <p id="errorMessage">
                Competition data load nahi ho saka.
            </p>

        </div>



        <!-- ==================================================
             EMPTY
        ================================================== -->

        <div
            id="emptyBox"
            class="empty-box"
        >

            <i class="fa-solid fa-trophy"></i>

            <h3>
                No Competition
            </h3>

            <p>
                Abhi koi active competition available nahi hai.
            </p>

        </div>



        <!-- ==================================================
             COMPETITION LIST
        ================================================== -->

        <div
            id="competitionList"
        ></div>



        <!-- ==================================================
             FOOTER
        ================================================== -->

        <div class="page-footer">

            Telethon Academic Department Competition

        </div>


    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="assets/js/competition.js"
    ></script>


</body>

</html>
