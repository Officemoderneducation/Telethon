<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Telethon - Academic Department Competition
    </title>


    <!-- ==================================================
         FONT AWESOME
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==================================================
         GOOGLE FONT
    ================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================================
         STYLE
    ================================================== -->

    <style>

        /* ==================================================
           RESET
        ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==================================================
           BODY
        ================================================== */

        body {

            font-family:
                "Inter",
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f4f6f9;

            color:
                #111827;

            min-height:
                100vh;
        }


        /* ==================================================
           HEADER
        ================================================== */

        .competition-header {

            width:
                100%;

            background:
                #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                17px 25px;
        }


        .header-inner {

            max-width:
                1200px;

            margin:
                0 auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;
        }


        /* ==================================================
           BRAND
        ================================================== */

        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                11px;
        }


        .brand-icon {

            width:
                43px;

            height:
                43px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                11px;

            background:
                #eef2ff;

            color:
                #4f46e5;

            font-size:
                19px;
        }


        .brand-name {

            font-size:
                21px;

            font-weight:
                800;

            color:
                #111827;
        }


        .brand-subtitle {

            margin-top:
                3px;

            font-size:
                12px;

            color:
                #6b7280;
        }


        /* ==================================================
           PUBLIC BADGE
        ================================================== */

        .public-badge {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                6px;

            padding:
                8px 12px;

            border-radius:
                20px;

            background:
                #ecfdf5;

            border:
                1px solid #a7f3d0;

            color:
                #047857;

            font-size:
                12px;

            font-weight:
                700;
        }


        /* ==================================================
           MAIN
        ================================================== */

        .main-container {

            width:
                100%;

            max-width:
                1000px;

            margin:
                0 auto;

            padding:
                40px 20px 60px;
        }


        /* ==================================================
           PAGE TITLE
        ================================================== */

        .page-title {

            text-align:
                center;

            margin-bottom:
                30px;
        }


        .page-title h1 {

            font-size:
                30px;

            line-height:
                1.3;

            font-weight:
                800;

            color:
                #111827;
        }


        /* ==================================================
           LOADING
        ================================================== */

        .loading-box {

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                18px;

            padding:
                55px 20px;

            text-align:
                center;

            color:
                #6b7280;
        }


        .loading-box i {

            display:
                block;

            font-size:
                30px;

            margin-bottom:
                12px;

            animation:
                spin 1s linear infinite;
        }


        @keyframes spin {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* ==================================================
           EMPTY
        ================================================== */

        .empty-box {

            display:
                none;

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                18px;

            padding:
                60px 20px;

            text-align:
                center;
        }


        .empty-box i {

            display:
                block;

            font-size:
                45px;

            color:
                #9ca3af;

            margin-bottom:
                15px;
        }


        .empty-box h3 {

            font-size:
                19px;

            color:
                #111827;

            margin-bottom:
                7px;
        }


        .empty-box p {

            color:
                #6b7280;

            font-size:
                14px;
        }


        /* ==================================================
           ERROR
        ================================================== */

        .error-box {

            display:
                none;

            background:
                #ffffff;

            border:
                1px solid #fecaca;

            border-radius:
                18px;

            padding:
                40px 20px;

            text-align:
                center;

            color:
                #991b1b;
        }


        .error-box i {

            display:
                block;

            font-size:
                35px;

            margin-bottom:
                12px;
        }


        .error-box h3 {

            font-size:
                18px;

            margin-bottom:
                7px;
        }


        .error-box p {

            font-size:
                14px;
        }


        /* ==================================================
           COMPETITION LIST
        ================================================== */

        #competitionList {

            display:
                grid;

            grid-template-columns:
                1fr;

            gap:
                25px;
        }


        /* ==================================================
           COMPETITION CARD
        ================================================== */

        .competition-card {

            width:
                100%;

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                20px;

            padding:
                45px 50px;

            box-shadow:
                0 10px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.06
                );

            text-align:
                center;
        }


        /* ==================================================
           COMPETITION NAME
        ================================================== */

        .competition-name {

            font-size:
                32px;

            font-weight:
                800;

            line-height:
                1.3;

            color:
                #111827;

            margin-bottom:
                18px;

            word-break:
                break-word;
        }


        /* ==================================================
           END TIME AREA
        ================================================== */

        .competition-end {

            display:
                flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            gap:
                5px;

            margin-bottom:
                42px;
        }


        .competition-end-label {

            font-size:
                13px;

            font-weight:
                600;

            color:
                #6b7280;

            text-transform:
                uppercase;

            letter-spacing:
                0.5px;
        }


        .competition-end-time {

            font-size:
                23px;

            font-weight:
                800;

            color:
                #111827;
        }


        /* ==================================================
           MATCH
        ================================================== */

        .competition-match {

            display:
                grid;

            grid-template-columns:
                minmax(
                    0,
                    1fr
                )
                75px
                minmax(
                    0,
                    1fr
                );

            align-items:
                center;

            gap:
                25px;
        }


        /* ==================================================
           TEAM / REGION
        ================================================== */

        .competition-side {

            min-height:
                105px;

            padding:
                22px 25px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid #e5e7eb;

            border-radius:
                15px;

            background:
                #f9fafb;

            color:
                #111827;

            font-size:
                20px;

            font-weight:
                700;

            line-height:
                1.45;

            text-align:
                center;

            word-break:
                break-word;
        }


        /* ==================================================
           VS
        ================================================== */

        .vs-area {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;
        }


        .vs-circle {

            width:
                62px;

            height:
                62px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                50%;

            background:
                #111827;

            color:
                #ffffff;

            font-size:
                17px;

            font-weight:
                800;

            box-shadow:
                0 6px 16px
                rgba(
                    0,
                    0,
                    0,
                    0.16
                );
        }


        /* ==================================================
           MULTIPLE CARD
        ================================================== */

        .competition-card + .competition-card {

            margin-top:
                0;
        }


        /* ==================================================
           TABLET
        ================================================== */

        @media (
            max-width: 800px
        ) {

            .main-container {

                padding:
                    35px 15px 50px;
            }


            .competition-card {

                padding:
                    35px 25px;
            }


            .competition-name {

                font-size:
                    27px;
            }


            .competition-match {

                grid-template-columns:
                    1fr;

                gap:
                    15px;
            }


            .competition-side {

                min-height:
                    85px;

                font-size:
                    19px;
            }


            .vs-area {

                padding:
                    3px 0;
            }


            .vs-circle {

                width:
                    52px;

                height:
                    52px;

                font-size:
                    15px;
            }

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (
            max-width: 600px
        ) {

            .competition-header {

                padding:
                    14px 15px;
            }


            .brand-icon {

                width:
                    39px;

                height:
                    39px;

                font-size:
                    17px;
            }


            .brand-name {

                font-size:
                    18px;
            }


            .brand-subtitle {

                font-size:
                    10px;
            }


            .public-badge {

                padding:
                    7px 9px;

                font-size:
                    10px;
            }


            .main-container {

                padding:
                    28px 12px 40px;
            }


            .page-title {

                margin-bottom:
                    22px;
            }


            .page-title h1 {

                font-size:
                    23px;
            }


            .competition-card {

                padding:
                    30px 16px;

                border-radius:
                    16px;
            }


            .competition-name {

                font-size:
                    23px;

                margin-bottom:
                    15px;
            }


            .competition-end {

                margin-bottom:
                    30px;
            }


            .competition-end-label {

                font-size:
                    11px;
            }


            .competition-end-time {

                font-size:
                    21px;
            }


            .competition-side {

                min-height:
                    78px;

                padding:
                    15px;

                font-size:
                    17px;

                border-radius:
                    12px;
            }


            .vs-circle {

                width:
                    48px;

                height:
                    48px;

                font-size:
                    14px;
            }

        }


        /* ==================================================
           SMALL MOBILE
        ================================================== */

        @media (
            max-width: 380px
        ) {

            .page-title h1 {

                font-size:
                    21px;
            }


            .competition-name {

                font-size:
                    21px;
            }


            .competition-end-time {

                font-size:
                    19px;
            }


            .competition-side {

                font-size:
                    16px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="competition-header">

        <div class="header-inner">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">

                    <i class="fa-solid fa-trophy"></i>

                </div>


                <div>

                    <div class="brand-name">
                        Telethon
                    </div>

                    <div class="brand-subtitle">
                        Academic Department Competition
                    </div>

                </div>

            </div>


            <!-- PUBLIC BADGE -->

            <div class="public-badge">

                <i class="fa-solid fa-globe"></i>

                Public

            </div>


        </div>

    </header>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="main-container">


        <!-- ==================================================
             PAGE TITLE
        ================================================== -->

        <div class="page-title">

            <h1>
                Academic Department Competition
            </h1>

        </div>



        <!-- ==================================================
             LOADING
        ================================================== -->

        <div
            id="loadingBox"
            class="loading-box"
        >

            <i class="fa-solid fa-spinner"></i>

            <p>
                Loading Competition...
            </p>

        </div>



        <!-- ==================================================
             ERROR
        ================================================== -->

        <div
            id="errorBox"
            class="error-box"
        >

            <i class="fa-solid fa-triangle-exclamation"></i>

            <h3>
                Competition Load Error
            </h3>

            <p id="errorMessage">
                Competition data load nahi ho saka.
            </p>

        </div>



        <!-- ==================================================
             EMPTY
        ================================================== -->

        <div
            id="emptyBox"
            class="empty-box"
        >

            <i class="fa-solid fa-trophy"></i>

            <h3>
                No Competition
            </h3>

            <p>
                Abhi koi competition available nahi hai.
            </p>

        </div>



        <!-- ==================================================
             COMPETITION LIST
        ================================================== -->

        <div
            id="competitionList"
        ></div>


    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="assets/js/competition.js"
    ></script>


</body>

</html>
