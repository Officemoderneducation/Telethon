<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Telethon - Competition
    </title>


    <!-- ==================================================
         FONT AWESOME
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==================================================
         STYLE
    ================================================== -->

    <style>

        /* ==================================================
           RESET
        ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==================================================
           BODY
        ================================================== */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f4f6f9;

            color:
                #1f2937;

            min-height:
                100vh;
        }


        /* ==================================================
           HEADER
        ================================================== */

        .competition-header {

            background:
                #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                18px 25px;

            position:
                sticky;

            top:
                0;

            z-index:
                100;
        }


        .header-inner {

            max-width:
                1250px;

            margin:
                0 auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;
        }


        /* ==================================================
           BRAND
        ================================================== */

        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;
        }


        .brand-icon {

            width:
                45px;

            height:
                45px;

            border-radius:
                11px;

            background:
                #eef2ff;

            color:
                #4f46e5;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                21px;
        }


        .brand h1 {

            font-size:
                22px;

            color:
                #111827;

            margin-bottom:
                3px;
        }


        .brand p {

            font-size:
                13px;

            color:
                #6b7280;
        }


        /* ==================================================
           PUBLIC BADGE
        ================================================== */

        .public-badge {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                7px;

            padding:
                9px 13px;

            border-radius:
                20px;

            background:
                #ecfdf5;

            color:
                #047857;

            border:
                1px solid #a7f3d0;

            font-size:
                13px;

            font-weight:
                600;
        }


        /* ==================================================
           MAIN
        ================================================== */

        .main-container {

            width:
                100%;

            max-width:
                1250px;

            margin:
                0 auto;

            padding:
                35px 20px 50px;
        }


        /* ==================================================
           PAGE TITLE
        ================================================== */

        .page-title {

            text-align:
                center;

            margin-bottom:
                30px;
        }


        .page-title h2 {

            font-size:
                30px;

            line-height:
                1.3;

            font-weight:
                800;

            color:
                #111827;
        }


        /* ==================================================
           LOADING
        ================================================== */

        .loading-box {

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                16px;

            padding:
                50px 20px;

            text-align:
                center;

            color:
                #6b7280;
        }


        .loading-box i {

            font-size:
                30px;

            margin-bottom:
                12px;

            animation:
                spin 1s linear infinite;
        }


        @keyframes spin {

            from {

                transform:
                    rotate(0deg);
            }

            to {

                transform:
                    rotate(360deg);
            }

        }


        /* ==================================================
           EMPTY
        ================================================== */

        .empty-box {

            display:
                none;

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                16px;

            padding:
                55px 20px;

            text-align:
                center;
        }


        .empty-box i {

            display:
                block;

            font-size:
                42px;

            color:
                #9ca3af;

            margin-bottom:
                15px;
        }


        .empty-box h3 {

            font-size:
                19px;

            color:
                #111827;

            margin-bottom:
                7px;
        }


        .empty-box p {

            color:
                #6b7280;

            font-size:
                14px;
        }


        /* ==================================================
           ERROR
        ================================================== */

        .error-box {

            display:
                none;

            background:
                #ffffff;

            border:
                1px solid #fecaca;

            border-radius:
                16px;

            padding:
                35px 20px;

            text-align:
                center;

            color:
                #991b1b;
        }


        .error-box i {

            font-size:
                35px;

            margin-bottom:
                12px;
        }


        .error-box h3 {

            margin-bottom:
                7px;
        }


        .error-box p {

            font-size:
                14px;
        }


        /* ==================================================
           COMPETITION LIST
        ================================================== */

        #competitionList {

            display:
                grid;

            grid-template-columns:
                1fr;

            gap:
                25px;
        }


        /* ==================================================
           COMPETITION CARD
        ================================================== */

        .competition-card {

            width:
                100%;

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                18px;

            padding:
                42px 45px;

            box-shadow:
                0 8px 25px
                rgba(
                    0,
                    0,
                    0,
                    0.06
                );

            text-align:
                center;
        }


        /* ==================================================
           COMPETITION NAME
        ================================================== */

        .competition-name {

            font-size:
                30px;

            line-height:
                1.35;

            font-weight:
                800;

            color:
                #111827;

            margin-bottom:
                14px;

            word-break:
                break-word;
        }


        /* ==================================================
           COMPETITION END
        ================================================== */

        .competition-end {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                6px;

            font-size:
                16px;

            color:
                #6b7280;

            margin-bottom:
                40px;
        }


        .competition-end-label {

            font-weight:
                500;
        }


        .competition-end-time {

            font-weight:
                700;

            color:
                #111827;
        }


        /* ==================================================
           VS SECTION
        ================================================== */

        .competition-match {

            display:
                grid;

            grid-template-columns:
                minmax(
                    0,
                    1fr
                )
                80px
                minmax(
                    0,
                    1fr
                );

            align-items:
                center;

            gap:
                25px;
        }


        /* ==================================================
           COMPETITION SIDE
        ================================================== */

        .competition-side {

            min-height:
                105px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px 25px;

            background:
                #f9fafb;

            border:
                1px solid #e5e7eb;

            border-radius:
                14px;

            color:
                #111827;

            font-size:
                21px;

            font-weight:
                700;

            line-height:
                1.45;

            text-align:
                center;

            word-break:
                break-word;
        }


        /* ==================================================
           VS
        ================================================== */

        .vs-area {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;
        }


        .vs-circle {

            width:
                62px;

            height:
                62px;

            border-radius:
                50%;

            background:
                #111827;

            color:
                #ffffff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                17px;

            font-weight:
                800;

            box-shadow:
                0 5px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.15
                );
        }


        /* ==================================================
           MULTIPLE COMPETITIONS
        ================================================== */

        .competition-number {

            display:
                none;
        }


        /* ==================================================
           TABLET
        ================================================== */

        @media (
            max-width: 800px
        ) {

            .main-container {

                padding:
                    28px 15px 40px;
            }


            .page-title h2 {

                font-size:
                    26px;
            }


            .competition-card {

                padding:
                    32px 25px;
            }


            .competition-name {

                font-size:
                    26px;
            }


            .competition-match {

                grid-template-columns:
                    1fr;

                gap:
                    15px;
            }


            .vs-area {

                padding:
                    2px 0;
            }


            .vs-circle {

                width:
                    52px;

                height:
                    52px;

                font-size:
                    15px;
            }


            .competition-side {

                min-height:
                    85px;

                font-size:
                    19px;

                padding:
                    18px;
            }

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (
            max-width: 600px
        ) {

            .competition-header {

                padding:
                    14px 15px;
            }


            .brand {

                gap:
                    9px;
            }


            .brand-icon {

                width:
                    40px;

                height:
                    40px;

                font-size:
                    18px;
            }


            .brand h1 {

                font-size:
                    18px;
            }


            .brand p {

                font-size:
                    11px;
            }


            .public-badge {

                padding:
                    7px 9px;

                font-size:
                    11px;
            }


            .main-container {

                padding:
                    25px 12px 35px;
            }


            .page-title {

                margin-bottom:
                    22px;
            }


            .page-title h2 {

                font-size:
                    23px;
            }


            .competition-card {

                padding:
                    28px 16px;

                border-radius:
                    15px;
            }


            .competition-name {

                font-size:
                    23px;

                margin-bottom:
                    12px;
            }


            .competition-end {

                font-size:
                    14px;

                margin-bottom:
                    28px;
            }


            .competition-side {

                min-height:
                    78px;

                font-size:
                    17px;

                padding:
                    15px;
            }


            .vs-circle {

                width:
                    48px;

                height:
                    48px;

                font-size:
                    14px;
            }

        }


        /* ==================================================
           SMALL MOBILE
        ================================================== */

        @media (
            max-width: 380px
        ) {

            .competition-name {

                font-size:
                    21px;
            }


            .competition-end {

                flex-direction:
                    column;

                gap:
                    3px;
            }


            .competition-side {

                font-size:
                    16px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="competition-header">

        <div class="header-inner">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">

                    <i class="fa-solid fa-trophy"></i>

                </div>


                <div>

                    <h1>
                        Telethon
                    </h1>

                    <p>
                        Competition
                    </p>

                </div>

            </div>


            <!-- PUBLIC -->

            <div class="public-badge">

                <i class="fa-solid fa-globe"></i>

                Public

            </div>


        </div>

    </header>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="main-container">


        <!-- ==================================================
             PAGE TITLE
        ================================================== -->

        <div class="page-title">

            <h2>
                Academic Department Competition
            </h2>

        </div>



        <!-- ==================================================
             LOADING
        ================================================== -->

        <div
            id="loadingBox"
            class="loading-box"
        >

            <i class="fa-solid fa-spinner"></i>

            <p>
                Loading Competition...
            </p>

        </div>



        <!-- ==================================================
             ERROR
        ================================================== -->

        <div
            id="errorBox"
            class="error-box"
        >

            <i class="fa-solid fa-triangle-exclamation"></i>

            <h3>
                Competition Load Error
            </h3>

            <p id="errorMessage">
                Competition data load nahi ho saka.
            </p>

        </div>



        <!-- ==================================================
             EMPTY
        ================================================== -->

        <div
            id="emptyBox"
            class="empty-box"
        >

            <i class="fa-solid fa-trophy"></i>

            <h3>
                No Competition
            </h3>

            <p>
                Abhi koi competition available nahi hai.
            </p>

        </div>



        <!-- ==================================================
             COMPETITION LIST
        ================================================== -->

        <div
            id="competitionList"
        ></div>


    </main>



    <!-- ==================================================
         COMPETITION JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="assets/js/competition.js"
    ></script>


</body>

</html>
