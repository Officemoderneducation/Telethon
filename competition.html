<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Academic Department Competition
    </title>


    <!-- ==================================================
         FONT AWESOME
    =================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==================================================
         CSS
    =================================================== -->

    <style>

        /* ==================================================
           RESET
        =================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==================================================
           BODY
        =================================================== */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #172033;

            background:
                radial-gradient(
                    circle at top left,
                    #dbeafe 0%,
                    transparent 32%
                ),
                radial-gradient(
                    circle at top right,
                    #e0e7ff 0%,
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f8fbff 0%,
                    #eef4ff 50%,
                    #f8fafc 100%
                );

        }


        /* ==================================================
           PAGE
        =================================================== */

        .competition-page {

            width: 100%;

            max-width: 1180px;

            margin: 0 auto;

            padding:
                42px 22px 60px;

        }


        /* ==================================================
           PAGE HEADER
        =================================================== */

        .page-header {

            position: relative;

            text-align: center;

            margin-bottom: 38px;

        }


        .page-header::before {

            content: "";

            display: block;

            width: 75px;

            height: 5px;

            margin: 0 auto 18px;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #1d4ed8,
                    #6366f1
                );

        }


        .page-header h1 {

            font-size: 34px;

            line-height: 1.2;

            font-weight: 900;

            letter-spacing: -0.5px;

            color: #172554;

            margin-bottom: 10px;

        }


        .page-header p {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                7px 15px;

            border-radius: 50px;

            background: rgba(
                255,
                255,
                255,
                0.85
            );

            border: 1px solid #dbeafe;

            color: #475569;

            font-size: 13px;

            font-weight: 700;

            box-shadow:
                0 5px 15px rgba(
                    15,
                    23,
                    42,
                    0.06
                );

        }


        .page-header p::before {

            content: "";

            width: 8px;

            height: 8px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 0 4px
                rgba(
                    34,
                    197,
                    94,
                    0.12
                );

        }


        /* ==================================================
           LOADING
        =================================================== */

        .loading-box {

            max-width: 500px;

            margin: 30px auto;

            padding: 45px 25px;

            text-align: center;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.9
                );

            border:
                1px solid #e2e8f0;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(
                    15,
                    23,
                    42,
                    0.08
                );

            color: #475569;

        }


        .loading-box i {

            display: block;

            font-size: 32px;

            color: #2563eb;

            margin-bottom: 15px;

        }


        .loading-box p {

            font-size: 15px;

            font-weight: 600;

        }


        /* ==================================================
           ERROR
        =================================================== */

        .error-box {

            display: none;

            max-width: 700px;

            margin: 25px auto;

            padding:
                18px 22px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #fff1f2,
                    #fef2f2
                );

            border:
                1px solid #fecdd3;

            color: #9f1239;

            text-align: center;

            font-size: 14px;

            font-weight: 600;

            box-shadow:
                0 8px 25px rgba(
                    190,
                    24,
                    93,
                    0.07
                );

        }


        .error-box i {

            margin-right: 8px;

        }


        /* ==================================================
           EMPTY
        =================================================== */

        .empty-box {

            display: none;

            max-width: 650px;

            margin: 35px auto;

            padding:
                55px 25px;

            text-align: center;

            background: #ffffff;

            border:
                1px solid #e2e8f0;

            border-radius: 24px;

            box-shadow:
                0 18px 45px rgba(
                    15,
                    23,
                    42,
                    0.09
                );

        }


        .empty-box i {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: 78px;

            height: 78px;

            margin-bottom: 20px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #e0e7ff
                );

            color: #64748b;

            font-size: 34px;

        }


        .empty-box h3 {

            font-size: 23px;

            color: #1e293b;

            margin-bottom: 8px;

        }


        .empty-box p {

            color: #64748b;

            font-size: 14px;

        }


        /* ==================================================
           COMPETITION LIST
        =================================================== */

        .competition-list {

            display: flex;

            flex-direction: column;

            gap: 30px;

        }


        /* ==================================================
           COMPETITION CARD
        =================================================== */

        .competition-card {

            position: relative;

            overflow: hidden;

            width: 100%;

            padding:
                34px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.97
                );

            border:
                1px solid #dbe3ef;

            border-radius: 28px;

            box-shadow:
                0 20px 55px rgba(
                    15,
                    23,
                    42,
                    0.10
                );

        }


        /* Top decorative line */

        .competition-card::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #1d4ed8,
                    #4f46e5,
                    #7c3aed
                );

        }


        /* ==================================================
           COMPETITION NAME
        =================================================== */

        .competition-name {

            text-align: center;

            font-size: 27px;

            line-height: 1.3;

            font-weight: 900;

            color: #172554;

            margin-bottom: 13px;

        }


        /* ==================================================
           DATE
        =================================================== */

        .competition-date {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            text-align: center;

            font-size: 16px;

            font-weight: 700;

            color: #475569;

            margin-bottom: 10px;

        }


        .competition-date::before {

            content: "\f073";

            font-family:
                "Font Awesome 6 Free";

            font-weight: 900;

            color: #2563eb;

        }


        /* ==================================================
           END TIME
        =================================================== */

        .competition-end {

            width: fit-content;

            margin:
                0 auto 34px;

            padding:
                9px 17px;

            border-radius: 50px;

            background:
                #fff7ed;

            border:
                1px solid #fed7aa;

            color: #9a3412;

            font-size: 13px;

            font-weight: 700;

        }


        .competition-end strong {

            color: #c2410c;

            font-size: 14px;

            margin-left: 5px;

        }


        /* ==================================================
           MATCH
        =================================================== */

        .competition-match {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                100px
                minmax(0, 1fr);

            align-items: stretch;

            gap: 22px;

        }


        /* ==================================================
           SIDE
        =================================================== */

        .competition-side {

            position: relative;

            min-height: 215px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            text-align: center;

            padding:
                30px 24px;

            border-radius: 23px;

            border:
                1px solid #dbeafe;

            background:
                linear-gradient(
                    145deg,
                    #ffffff 0%,
                    #f8fbff 45%,
                    #eff6ff 100%
                );

            box-shadow:
                inset 0 1px 0
                rgba(
                    255,
                    255,
                    255,
                    0.9
                ),
                0 10px 25px
                rgba(
                    37,
                    99,
                    235,
                    0.06
                );

        }


        .competition-side::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            width: 6px;

            height: 100%;

            border-radius:
                23px 0 0 23px;

            background:
                linear-gradient(
                    180deg,
                    #2563eb,
                    #4f46e5
                );

        }


        /* ==================================================
           TEAM NAME
        =================================================== */

        .team-name {

            min-height: 65px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                0 8px;

            font-size: 25px;

            line-height: 1.25;

            font-weight: 900;

            color: #1e3a8a;

            word-break: break-word;

        }


        /* ==================================================
           TOTAL
        =================================================== */

        .team-total {

            margin-top: 25px;

            padding-top: 20px;

            border-top:
                1px solid #dbeafe;

        }


        .team-total-label {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            font-size: 13px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 0.6px;

            color: #64748b;

            margin-bottom: 9px;

        }


        .team-total-label::before {

            content: "\f51e";

            font-family:
                "Font Awesome 6 Free";

            font-weight: 900;

            color: #2563eb;

        }


        .team-total-unit {

            font-size: 37px;

            line-height: 1;

            font-weight: 900;

            color: #0f172a;

            letter-spacing: -1px;

        }


        /* ==================================================
           VS AREA
        =================================================== */

        .vs-area {

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .vs-circle {

            position: relative;

            width: 76px;

            height: 76px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #172554,
                    #3730a3
                );

            color: #ffffff;

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 0.5px;

            box-shadow:
                0 12px 30px rgba(
                    30,
                    41,
                    90,
                    0.28
                );

        }


        .vs-circle::before {

            content: "";

            position: absolute;

            inset: -7px;

            border-radius: 50%;

            border:
                1px solid #c7d2fe;

        }


        /* ==================================================
           WINNER APPRECIATION
        =================================================== */

        .winner-appreciation {

            position: relative;

            margin-top: 30px;

            padding:
                28px 25px;

            text-align: center;

            overflow: hidden;

            border-radius: 22px;

            border:
                1px solid #fde68a;

            background:
                linear-gradient(
                    135deg,
                    #fffbeb,
                    #fff7ed,
                    #fefce8
                );

            box-shadow:
                0 12px 30px rgba(
                    146,
                    64,
                    14,
                    0.08
                );

        }


        .winner-appreciation::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #f59e0b,
                    #eab308,
                    #f97316
                );

        }


        .winner-appreciation-title {

            font-size: 18px;

            font-weight: 900;

            color: #92400e;

            margin-bottom: 13px;

        }


        .winner-teacher-name {

            display: inline-block;

            padding:
                9px 20px;

            margin-bottom: 14px;

            border-radius: 50px;

            background: #ffffff;

            border:
                1px solid #fcd34d;

            color: #78350f;

            font-size: 21px;

            font-weight: 900;

            box-shadow:
                0 6px 18px rgba(
                    146,
                    64,
                    14,
                    0.08
                );

        }


        .winner-appreciation-text {

            color: #57534e;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;

        }


        .winner-appreciation-blessing {

            color: #78716c;

            font-size: 13px;

            line-height: 1.6;

            font-weight: 500;

        }


        /* ==================================================
           TABLET
        =================================================== */

        @media (
            max-width: 850px
        ) {

            .competition-page {

                padding:
                    32px 18px 50px;

            }


            .competition-card {

                padding:
                    28px 22px;

            }


            .competition-match {

                grid-template-columns:
                    minmax(0, 1fr)
                    75px
                    minmax(0, 1fr);

                gap: 14px;

            }


            .team-name {

                font-size: 22px;

            }


            .team-total-unit {

                font-size: 32px;

            }

        }


        /* ==================================================
           MOBILE
        =================================================== */

        @media (
            max-width: 700px
        ) {

            body {

                background:
                    linear-gradient(
                        180deg,
                        #eef4ff,
                        #f8fafc
                    );

            }


            .competition-page {

                padding:
                    25px 12px 40px;

            }


            .page-header {

                margin-bottom: 28px;

            }


            .page-header::before {

                width: 60px;

                height: 4px;

                margin-bottom: 14px;

            }


            .page-header h1 {

                font-size: 25px;

            }


            .page-header p {

                font-size: 12px;

                padding:
                    6px 12px;

            }


            .competition-list {

                gap: 20px;

            }


            .competition-card {

                padding:
                    27px 14px 18px;

                border-radius: 21px;

            }


            .competition-name {

                font-size: 21px;

                padding:
                    0 5px;

            }


            .competition-date {

                font-size: 14px;

            }


            .competition-end {

                font-size: 12px;

                padding:
                    8px 13px;

                margin-bottom: 25px;

            }


            .competition-end strong {

                font-size: 13px;

            }


            .competition-match {

                grid-template-columns: 1fr;

                gap: 0;

            }


            .competition-side {

                min-height: 165px;

                padding:
                    23px 15px;

                border-radius: 18px;

            }


            .competition-side::before {

                width: 5px;

                border-radius:
                    18px 0 0 18px;

            }


            .team-name {

                min-height: 50px;

                font-size: 21px;

            }


            .team-total {

                margin-top: 18px;

                padding-top: 15px;

            }


            .team-total-label {

                font-size: 11px;

            }


            .team-total-unit {

                font-size: 30px;

            }


            .vs-area {

                height: 65px;

            }


            .vs-circle {

                width: 57px;

                height: 57px;

                font-size: 15px;

            }


            .vs-circle::before {

                inset: -5px;

            }


            .winner-appreciation {

                margin-top: 22px;

                padding:
                    23px 15px;

                border-radius: 18px;

            }


            .winner-appreciation-title {

                font-size: 16px;

                line-height: 1.4;

            }


            .winner-teacher-name {

                font-size: 18px;

                padding:
                    8px 15px;

                max-width: 100%;

                word-break: break-word;

            }


            .winner-appreciation-text {

                font-size: 13px;

            }


            .winner-appreciation-blessing {

                font-size: 12px;

            }

        }


        /* ==================================================
           SMALL MOBILE
        =================================================== */

        @media (
            max-width: 400px
        ) {

            .competition-page {

                padding:
                    20px 9px 35px;

            }


            .page-header h1 {

                font-size: 22px;

            }


            .competition-card {

                padding:
                    25px 11px 16px;

            }


            .competition-name {

                font-size: 19px;

            }


            .competition-side {

                min-height: 155px;

            }


            .team-name {

                font-size: 19px;

            }


            .team-total-unit {

                font-size: 28px;

            }

        }

    </style>

</head>


<body>


    <main class="competition-page">


        <!-- ==================================================
             PAGE HEADER
        =================================================== -->

        <header class="page-header">

            <h1>
                Academic Department Competition
            </h1>

            <p>
                Live Competition
            </p>

        </header>


        <!-- ==================================================
             LOADING
        =================================================== -->

        <div
            id="loadingBox"
            class="loading-box"
        >

            <i
                class="fa-solid fa-spinner fa-spin"
            ></i>

            <p>
                Competition loading...
            </p>

        </div>


        <!-- ==================================================
             ERROR
        =================================================== -->

        <div
            id="errorBox"
            class="error-box"
        >

            <i
                class="fa-solid fa-circle-exclamation"
            ></i>

            <span id="errorMessage">
                Competition data load nahi ho saka.
            </span>

        </div>


        <!-- ==================================================
             EMPTY
        =================================================== -->

        <div
            id="emptyBox"
            class="empty-box"
        >

            <i
                class="fa-solid fa-trophy"
            ></i>

            <h3>
                No Active Competition
            </h3>

            <p>
                Abhi koi active competition available nahi hai.
            </p>

        </div>


        <!-- ==================================================
             COMPETITION LIST
        =================================================== -->

        <div
            id="competitionList"
            class="competition-list"
        ></div>


    </main>


    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script
        type="module"
        src="assets/js/competition.js"
    ></script>


</body>

</html>
