<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Telethon - Academic Department Competition
    </title>


    <!-- ==================================================
         FONT AWESOME
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==================================================
         GOOGLE FONT
    ================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================================
         STYLE
    ================================================== -->

    <style>

        /* ==================================================
           RESET
        ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==================================================
           BODY
        ================================================== */

        body {

            font-family:
                "Inter",
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f4f6f9;

            color:
                #111827;

            min-height:
                100vh;
        }


        /* ==================================================
           HEADER
        ================================================== */

        .competition-header {

            width:
                100%;

            background:
                #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                17px 25px;
        }


        .header-inner {

            max-width:
                1200px;

            margin:
                0 auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;
        }


        /* ==================================================
           BRAND
        ================================================== */

        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                11px;
        }


        .brand-icon {

            width:
                43px;

            height:
                43px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                11px;

            background:
                #eef2ff;

            color:
                #4f46e5;

            font-size:
                19px;
        }


        .brand-name {

            font-size:
                21px;

            font-weight:
                800;

            color:
                #111827;
        }


        .brand-subtitle {

            margin-top:
                3px;

            font-size:
                12px;

            color:
                #6b7280;
        }


        /* ==================================================
           PUBLIC BADGE
        ================================================== */

        .public-badge {

            display:
                inline-flex;

            align-items:
                center;

            gap:
                6px;

            padding:
                8px 12px;

            border-radius:
                20px;

            background:
                #ecfdf5;

            border:
                1px solid #a7f3d0;

            color:
                #047857;

            font-size:
                12px;

            font-weight:
                700;
        }


        /* ==================================================
           MAIN
        ================================================== */

        .main-container {

            width:
                100%;

            max-width:
                1050px;

            margin:
                0 auto;

            padding:
                40px 20px 60px;
        }


        /* ==================================================
           PAGE TITLE
        ================================================== */

        .page-title {

            text-align:
                center;

            margin-bottom:
                28px;
        }


        .page-title h1 {

            font-size:
                30px;

            line-height:
                1.3;

            font-weight:
                800;

            color:
                #111827;
        }


        .page-title p {

            margin-top:
                8px;

            color:
                #6b7280;

            font-size:
                14px;
        }


        /* ==================================================
           LOADING
        ================================================== */

        .loading-box {

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                18px;

            padding:
                55px 20px;

            text-align:
                center;

            color:
                #6b7280;
        }


        .loading-box i {

            display:
                block;

            font-size:
                30px;

            margin-bottom:
                12px;

            animation:
                spin 1s linear infinite;
        }


        @keyframes spin {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* ==================================================
           ERROR
        ================================================== */

        .error-box {

            display:
                none;

            background:
                #ffffff;

            border:
                1px solid #fecaca;

            border-radius:
                18px;

            padding:
                45px 20px;

            text-align:
                center;

            color:
                #991b1b;
        }


        .error-box i {

            display:
                block;

            font-size:
                38px;

            margin-bottom:
                14px;
        }


        .error-box h3 {

            font-size:
                19px;

            margin-bottom:
                8px;
        }


        .error-box p {

            font-size:
                14px;

            color:
                #7f1d1d;
        }


        /* ==================================================
           EMPTY
        ================================================== */

        .empty-box {

            display:
                none;

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                18px;

            padding:
                60px 20px;

            text-align:
                center;
        }


        .empty-box i {

            display:
                block;

            font-size:
                45px;

            color:
                #9ca3af;

            margin-bottom:
                15px;
        }


        .empty-box h3 {

            font-size:
                19px;

            color:
                #111827;

            margin-bottom:
                7px;
        }


        .empty-box p {

            color:
                #6b7280;

            font-size:
                14px;

            line-height:
                1.6;
        }


        /* ==================================================
           COMPETITION LIST
        ================================================== */

        #competitionList {

            display:
                none;

            width:
                100%;
        }


        /* ==================================================
           COMPETITION CARD
        ================================================== */

        .competition-card {

            width:
                100%;

            background:
                #ffffff;

            border:
                1px solid #e5e7eb;

            border-radius:
                22px;

            padding:
                38px;

            box-shadow:
                0 12px 35px
                rgba(
                    0,
                    0,
                    0,
                    0.07
                );
        }


        /* ==================================================
           COMPETITION NAME
        ================================================== */

        .competition-name {

            text-align:
                center;

            font-size:
                29px;

            font-weight:
                800;

            line-height:
                1.35;

            color:
                #111827;

            word-break:
                break-word;

            margin-bottom:
                12px;
        }


        /* ==================================================
           DATE
        ================================================== */

        .competition-date {

            text-align:
                center;

            color:
                #6b7280;

            font-size:
                14px;

            font-weight:
                600;

            margin-bottom:
                22px;
        }


        .competition-date i {

            margin-right:
                6px;

            color:
                #4f46e5;
        }


        /* ==================================================
           END TIME
        ================================================== */

        .competition-end {

            width:
                fit-content;

            min-width:
                190px;

            margin:
                0 auto 35px;

            padding:
                13px 22px;

            border:
                1px solid #e5e7eb;

            border-radius:
                13px;

            background:
                #f9fafb;

            text-align:
                center;
        }


        .competition-end-label {

            display:
                block;

            color:
                #6b7280;

            font-size:
                11px;

            font-weight:
                700;

            text-transform:
                uppercase;

            letter-spacing:
                0.6px;

            margin-bottom:
                4px;
        }


        .competition-end-time {

            font-size:
                22px;

            font-weight:
                800;

            color:
                #111827;
        }


        /* ==================================================
           SIDES
        ================================================== */

        .competition-match {

            display:
                grid;

            grid-template-columns:
                minmax(0, 1fr)
                85px
                minmax(0, 1fr);

            gap:
                20px;

            align-items:
                stretch;
        }


        /* ==================================================
           SIDE CARD
        ================================================== */

        .competition-side {

            border:
                1px solid #e5e7eb;

            border-radius:
                17px;

            background:
                #ffffff;

            overflow:
                hidden;

            min-width:
                0;
        }


        .side-header {

            padding:
                14px 18px;

            background:
                #f9fafb;

            border-bottom:
                1px solid #e5e7eb;

            text-align:
                center;
        }


        .side-title {

            font-size:
                17px;

            font-weight:
                800;

            color:
                #111827;
        }


        /* ==================================================
           PARTICIPANT LIST
        ================================================== */

        .side-body {

            padding:
                16px;
        }


        .participant-item {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

            padding:
                15px 16px;

            margin-bottom:
                10px;

            border:
                1px solid #e5e7eb;

            border-radius:
                11px;

            background:
                #f9fafb;
        }


        .participant-item:last-child {

            margin-bottom:
                0;
        }


        .participant-name {

            min-width:
                0;

            font-size:
                15px;

            font-weight:
                700;

            color:
                #111827;

            line-height:
                1.4;

            word-break:
                break-word;
        }


        .participant-type {

            flex:
                0 0 auto;

            padding:
                5px 8px;

            border-radius:
                6px;

            background:
                #eef2ff;

            color:
                #4f46e5;

            font-size:
                10px;

            font-weight:
                700;
        }


        /* ==================================================
           TOTAL
        ================================================== */

        .side-total {

            margin-top:
                15px;

            padding:
                18px;

            border-radius:
                13px;

            background:
                #111827;

            color:
                #ffffff;

            text-align:
                center;
        }


        .side-total-label {

            display:
                block;

            font-size:
                11px;

            font-weight:
                600;

            opacity:
                0.75;

            text-transform:
                uppercase;

            letter-spacing:
                0.5px;

            margin-bottom:
                5px;
        }


        .side-total-value {

            display:
                block;

            font-size:
                28px;

            font-weight:
                800;

            line-height:
                1.2;
        }


        .side-total-unit {

            font-size:
                12px;

            opacity:
                0.8;

            margin-left:
                3px;
        }


        /* ==================================================
           VS
        ================================================== */

        .vs-container {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;
        }


        .vs-circle {

            width:
                68px;

            height:
                68px;

            border-radius:
                50%;

            background:
                #111827;

            color:
                #ffffff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                18px;

            font-weight:
                800;

            box-shadow:
                0 7px 18px
                rgba(
                    0,
                    0,
                    0,
                    0.16
                );
        }


        /* ==================================================
           NO DATA
        ================================================== */

        .no-data {

            padding:
                20px 10px;

            text-align:
                center;

            color:
                #9ca3af;

            font-size:
                13px;
        }


        /* ==================================================
           LAST UPDATED
        ================================================== */

        .competition-footer {

            text-align:
                center;

            margin-top:
                24px;

            color:
                #9ca3af;

            font-size:
                11px;
        }


        /* ==================================================
           RESPONSIVE
        ================================================== */

        @media (
            max-width: 800px
        ) {

            .main-container {

                padding:
                    32px 15px 50px;
            }


            .competition-card {

                padding:
                    28px 22px;
            }


            .competition-match {

                grid-template-columns:
                    1fr;

                gap:
                    15px;
            }


            .vs-container {

                padding:
                    2px 0;
            }


            .vs-circle {

                width:
                    52px;

                height:
                    52px;

                font-size:
                    15px;
            }

        }


        @media (
            max-width: 600px
        ) {

            .competition-header {

                padding:
                    14px 15px;
            }


            .header-inner {

                gap:
                    10px;
            }


            .brand-icon {

                width:
                    39px;

                height:
                    39px;

                font-size:
                    17px;
            }


            .brand-name {

                font-size:
                    18px;
            }


            .brand-subtitle {

                font-size:
                    10px;
            }


            .public-badge {

                padding:
                    7px 9px;

                font-size:
                    10px;
            }


            .main-container {

                padding:
                    26px 12px 40px;
            }


            .page-title {

                margin-bottom:
                    20px;
            }


            .page-title h1 {

                font-size:
                    23px;
            }


            .page-title p {

                font-size:
                    12px;
            }


            .competition-card {

                padding:
                    24px 14px;

                border-radius:
                    17px;
            }


            .competition-name {

                font-size:
                    23px;
            }


            .competition-date {

                font-size:
                    12px;
            }


            .competition-end {

                min-width:
                    170px;

                margin-bottom:
                    25px;
            }


            .competition-end-time {

                font-size:
                    20px;
            }


            .side-body {

                padding:
                    12px;
            }


            .participant-item {

                padding:
                    13px;

                flex-direction:
                    column;

                align-items:
                    stretch;

                text-align:
                    center;
            }


            .participant-type {

                align-self:
                    center;
            }


            .side-total-value {

                font-size:
                    24px;
            }

        }


        @media (
            max-width: 380px
        ) {

            .page-title h1 {

                font-size:
                    21px;
            }


            .competition-name {

                font-size:
                    21px;
            }


            .competition-card {

                padding:
                    20px 10px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="competition-header">

        <div class="header-inner">


            <div class="brand">

                <div class="brand-icon">

                    <i class="fa-solid fa-trophy"></i>

                </div>


                <div>

                    <div class="brand-name">
                        Telethon
                    </div>

                    <div class="brand-subtitle">
                        Academic Department Competition
                    </div>

                </div>

            </div>


            <div class="public-badge">

                <i class="fa-solid fa-globe"></i>

                Public

            </div>


        </div>

    </header>



    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="main-container">


        <!-- ==================================================
             PAGE TITLE
        ================================================== -->

        <div class="page-title">

            <h1>
                Academic Department Competition
            </h1>

            <p>
                Live Competition
            </p>

        </div>



        <!-- ==================================================
             LOADING
        ================================================== -->

        <div
            id="loadingBox"
            class="loading-box"
        >

            <i class="fa-solid fa-spinner"></i>

            <p>
                Loading Competition...
            </p>

        </div>



        <!-- ==================================================
             ERROR
        ================================================== -->

        <div
            id="errorBox"
            class="error-box"
        >

            <i class="fa-solid fa-triangle-exclamation"></i>

            <h3>
                Competition Load Error
            </h3>

            <p id="errorMessage">
                Competition data load nahi ho saka.
            </p>

        </div>



        <!-- ==================================================
             EMPTY
        ================================================== -->

        <div
            id="emptyBox"
            class="empty-box"
        >

            <i class="fa-solid fa-trophy"></i>

            <h3>
                Competition Not Available
            </h3>

            <p>
                Yeh competition available nahi hai ya iska
                end time complete ho chuka hai.
            </p>

        </div>



        <!-- ==================================================
             COMPETITION
        ================================================== -->

        <div
            id="competitionList"
        ></div>


    </main>



    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="assets/js/competition.js"
    ></script>


</body>

</html>
