<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Academic Department Competition
    </title>


    <!-- ==================================================
         FONT AWESOME
    =================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- ==================================================
         CSS
    =================================================== -->

    <style>

        /* ==================================================
           RESET
        ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ==================================================
           BODY
        ================================================== */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef4ff,
                    #f8fbff
                );

            color: #1f2937;

        }


        /* ==================================================
           PAGE
        ================================================== */

        .competition-page {

            width: 100%;

            max-width: 1200px;

            margin: 0 auto;

            padding: 35px 20px 50px;

        }


        /* ==================================================
           HEADER
        ================================================== */

        .page-header {

            text-align: center;

            margin-bottom: 30px;

        }


        .page-header h1 {

            font-size: 30px;

            font-weight: 800;

            color: #172554;

            margin-bottom: 8px;

        }


        .page-header p {

            font-size: 15px;

            color: #64748b;

        }


        /* ==================================================
           LOADING
        ================================================== */

        .loading-box {

            text-align: center;

            padding: 50px 20px;

            color: #475569;

        }


        .loading-box i {

            font-size: 30px;

            margin-bottom: 12px;

        }


        /* ==================================================
           ERROR
        ================================================== */

        .error-box {

            display: none;

            max-width: 700px;

            margin: 20px auto;

            padding: 18px 20px;

            border-radius: 12px;

            background: #fef2f2;

            border: 1px solid #fecaca;

            color: #991b1b;

            text-align: center;

        }


        /* ==================================================
           EMPTY
        ================================================== */

        .empty-box {

            display: none;

            max-width: 700px;

            margin: 30px auto;

            padding: 40px 20px;

            text-align: center;

            background: #ffffff;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(
                    15,
                    23,
                    42,
                    0.08
                );

        }


        .empty-box i {

            font-size: 42px;

            color: #94a3b8;

            margin-bottom: 15px;

        }


        .empty-box h3 {

            font-size: 22px;

            margin-bottom: 8px;

        }


        .empty-box p {

            color: #64748b;

        }


        /* ==================================================
           COMPETITION LIST
        ================================================== */

        .competition-list {

            display: flex;

            flex-direction: column;

            gap: 28px;

        }


        /* ==================================================
           COMPETITION CARD
        ================================================== */

        .competition-card {

            width: 100%;

            background: #ffffff;

            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 15px 40px rgba(
                    15,
                    23,
                    42,
                    0.10
                );

            border: 1px solid #e2e8f0;

        }


        /* ==================================================
           COMPETITION NAME
        ================================================== */

        .competition-name {

            text-align: center;

            font-size: 24px;

            font-weight: 800;

            color: #0f172a;

            margin-bottom: 12px;

        }


        /* ==================================================
           DATE
        ================================================== */

        .competition-date {

            text-align: center;

            font-size: 17px;

            font-weight: 600;

            color: #475569;

            margin-bottom: 8px;

        }


        /* ==================================================
           END TIME
        ================================================== */

        .competition-end {

            text-align: center;

            font-size: 15px;

            color: #64748b;

            margin-bottom: 30px;

        }


        .competition-end strong {

            color: #b91c1c;

            font-size: 16px;

            margin-left: 5px;

        }


        /* ==================================================
           MATCH
        ================================================== */

        .competition-match {

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                90px
                minmax(0, 1fr);

            align-items: stretch;

            gap: 18px;

        }


        /* ==================================================
           SIDE
        ================================================== */

        .competition-side {

            min-height: 190px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            text-align: center;

            padding: 28px 20px;

            border-radius: 20px;

            border: 2px solid #dbeafe;

            background:
                linear-gradient(
                    145deg,
                    #f8fbff,
                    #eef6ff
                );

        }


        /* ==================================================
           TEAM NAME
        ================================================== */

        .team-name {

            min-height: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 24px;

            font-weight: 800;

            color: #1e3a8a;

            word-break: break-word;

        }


        /* ==================================================
           TOTAL
        ================================================== */

        .team-total {

            margin-top: 25px;

        }


        .team-total-label {

            font-size: 15px;

            font-weight: 700;

            color: #64748b;

            margin-bottom: 6px;

        }


        .team-total-unit {

            font-size: 34px;

            line-height: 1;

            font-weight: 900;

            color: #0f172a;

        }


        /* ==================================================
           VS AREA
        ================================================== */

        .vs-area {

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .vs-circle {

            width: 68px;

            height: 68px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #172554;

            color: #ffffff;

            font-size: 18px;

            font-weight: 900;

            box-shadow:
                0 8px 20px rgba(
                    23,
                    37,
                    84,
                    0.25
                );

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (
            max-width: 700px
        ) {

            .competition-page {

                padding:
                    20px 12px 35px;

            }


            .competition-card {

                padding: 20px 14px;

                border-radius: 18px;

            }


            .page-header h1 {

                font-size: 25px;

            }


            .competition-name {

                font-size: 20px;

            }


            .competition-date {

                font-size: 15px;

            }


            .competition-match {

                grid-template-columns: 1fr;

                gap: 12px;

            }


            .competition-side {

                min-height: 150px;

                padding: 22px 15px;

            }


            .team-name {

                font-size: 21px;

            }


            .team-total-unit {

                font-size: 30px;

            }


            .vs-area {

                height: 60px;

            }


            .vs-circle {

                width: 55px;

                height: 55px;

                font-size: 16px;

            }

        }

    </style>

</head>


<body>


    <main class="competition-page">


        <!-- ==================================================
             PAGE HEADER

             IMPORTANT:
             Academic Department Competition
             YAHAN SIRF 1 BAAR HAI.
        =================================================== -->

        <header class="page-header">

            <h1>
                Academic Department Competition
            </h1>

            <p>
                Live Competition
            </p>

        </header>


        <!-- ==================================================
             LOADING
        =================================================== -->

        <div
            id="loadingBox"
            class="loading-box"
        >

            <i
                class="fa-solid fa-spinner fa-spin"
            ></i>

            <p>
                Competition loading...
            </p>

        </div>


        <!-- ==================================================
             ERROR
        =================================================== -->

        <div
            id="errorBox"
            class="error-box"
        >

            <i
                class="fa-solid fa-circle-exclamation"
            ></i>

            <span id="errorMessage">
                Competition data load nahi ho saka.
            </span>

        </div>


        <!-- ==================================================
             EMPTY
        =================================================== -->

        <div
            id="emptyBox"
            class="empty-box"
        >

            <i
                class="fa-solid fa-trophy"
            ></i>

            <h3>
                No Active Competition
            </h3>

            <p>
                Abhi koi active competition available nahi hai.
            </p>

        </div>


        <!-- ==================================================
             COMPETITION LIST
        =================================================== -->

        <div
            id="competitionList"
            class="competition-list"
        ></div>


    </main>


    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="assets/js/competition.js"
    ></script>


</body>

</html>
